services:
  # Bot service - NestJS Telegram Bot application (local build)
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cloudnode-bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/cloudnode?schema=public
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudnode-network
    ports:
      - "3001:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database service - PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cloudnode-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=cloudnode
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudnode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis service - для BullMQ очередей
  redis:
    image: redis:7-alpine
    container_name: cloudnode-redis
    restart: always
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local

networks:
  cloudnode-network:
    driver: bridge

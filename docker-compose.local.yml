services:
  # Bot service - NestJS Telegram Bot application
  bot:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    container_name: cloudnode-bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/cloudnode?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MARZBAN_URL: ${MARZBAN_URL}
      MARZBAN_ADMIN_USERNAME: ${MARZBAN_ADMIN_USERNAME}
      MARZBAN_ADMIN_PASSWORD: ${MARZBAN_ADMIN_PASSWORD}
      INFRASTRUCTURE_IP_LIST: ${INFRASTRUCTURE_IP_LIST}
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cloudnode-network
    ports:
      - "3001:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database service - PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cloudnode-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=cloudnode
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis service - для BullMQ очередей
  redis:
    image: redis:7-alpine
    container_name: cloudnode-redis
    restart: always
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Marzban Panel - локально для тестирования
  marzban:
    image: gozargah/marzban:latest
    container_name: cloudnode-marzban
    restart: always
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - DASHBOARD_PATH=/dashboard/
      - XRAY_JSON_PATH=/var/lib/marzban/xray_config.json
      - SQLALCHEMY_DATABASE_URL=sqlite:////var/lib/marzban/db.sqlite3
    volumes:
      - marzban-data:/var/lib/marzban
      - marzban-certs:/var/lib/marzban/certs
    networks:
      - cloudnode-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/dashboard/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  marzban-data:
    driver: local
  marzban-certs:
    driver: local

networks:
  cloudnode-network:
    driver: bridge

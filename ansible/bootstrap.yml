---
# Ansible Playbook: Bootstrap Servers
# Description: Initial setup - install SSH keys and disable password authentication
# ==========================================

- name: Bootstrap Server - SSH Key Setup
  hosts: all
  become: yes
  gather_facts: no
  strategy: linear

  vars:
    ssh_public_key: "{{ lookup('env', 'SSH_PUBLIC_KEY') }}"
    master_address: "{{ lookup('env', 'MASTER_ADDRESS') | default(inventory_hostname, true) }}"
    ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

  pre_tasks:
    - name: Wait for connection
      wait_for_connection:
        timeout: 60
        delay: 5

    - name: Gather minimal facts
      setup:
        gather_subset:
          - min

    - name: Validate SSH public key is provided
      fail:
        msg: "SSH_PUBLIC_KEY is required but not provided"
      when: ssh_public_key | length == 0

  tasks:
    - name: Ensure .ssh directory exists for root with correct permissions
      file:
        path: /root/.ssh
        state: directory
        mode: '0700'
        owner: root
        group: root

    - name: Ensure authorized_keys file exists with correct permissions
      file:
        path: /root/.ssh/authorized_keys
        state: touch
        mode: '0600'
        owner: root
        group: root

    - name: Install authorized_keys
      authorized_key:
        user: root
        key: "{{ ssh_public_key }}"
        state: present
        exclusive: yes
      register: key_install

    - name: Verify authorized_keys permissions
      file:
        path: /root/.ssh/authorized_keys
        state: file
        mode: '0600'
        owner: root
        group: root

    - name: Restore SELinux context on .ssh directory (if SELinux enabled)
      command: restorecon -R /root/.ssh
      changed_when: false

    - name: Display authorized_keys content for debug
      command: cat /root/.ssh/authorized_keys
      changed_when: false

    - name: Display key installation status
      debug:
        msg: "SSH key installed successfully on {{ inventory_hostname }}"
      when: key_install.changed

    - name: Ensure SSH service is running
      systemd:
        name: ssh
        state: started
        enabled: yes

    - name: Backup original SSH config
      copy:
        src: /etc/ssh/sshd_config
        dest: /etc/ssh/sshd_config.backup.{{ ansible_date_time.epoch }}
        remote_src: yes

    - name: Disable password authentication
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PasswordAuthentication'
        line: 'PasswordAuthentication no'
        state: present
      notify: restart sshd

    - name: Disable root password login (ensure key-only)
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PermitRootLogin'
        line: 'PermitRootLogin prohibit-password'
        state: present
      notify: restart sshd

    - name: Ensure PubkeyAuthentication is enabled
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: '^#?PubkeyAuthentication'
        line: 'PubkeyAuthentication yes'
        state: present
      notify: restart sshd

    - name: Validate SSH configuration
      command: sshd -t
      changed_when: false

    - name: Display SSH config for verification
      command: grep -E "^(PasswordAuthentication|PubkeyAuthentication|PermitRootLogin)" /etc/ssh/sshd_config
      changed_when: false

    - name: Restart SSH service to apply changes
      systemd:
        name: ssh
        state: restarted

    - name: Wait for SSH to come back
      wait_for:
        port: 22
        host: '{{ inventory_hostname }}'
        delay: 3
        timeout: 60
      delegate_to: localhost
      become: no

    - name: Verify PasswordAuthentication is disabled
      command: grep -E "^PasswordAuthentication no" /etc/ssh/sshd_config
      changed_when: false

    - name: Verify PubkeyAuthentication is enabled
      command: grep -E "^PubkeyAuthentication yes" /etc/ssh/sshd_config
      changed_when: false

    - name: Display bootstrap completion
      debug:
        msg: |
          ==========================================
          Bootstrap completed for: {{ inventory_hostname }}
          - SSH key installed at /root/.ssh/authorized_keys
          - Password authentication disabled: YES
          - PubkeyAuthentication enabled: YES
          - Ready for key-only SSH access
          ==========================================

  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

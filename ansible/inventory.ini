; Ansible inventory for VPN infrastructure nodes
; Add your infrastructure server IPs here

[nodes]
; Example: 192.168.1.100 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
; Replace with your actual server IPs or use environment variables
${INFRASTRUCTURE_IP_LIST}

[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

; Ansible inventory for VPN infrastructure
; This file is auto-generated by GitLab CI from INFRASTRUCTURE_IP_LIST and SERVER_IP
; For local use, run: ./generate_inventory.sh

[master]
; Master server (Marzban Core + Bot)
; Will be populated automatically during CI/CD pipeline

[nodes]
; Infrastructure nodes (Marzban Nodes)
; Example entries (will be replaced by CI):
; 192.168.1.100 ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa
; Servers will be added here automatically during CI/CD pipeline

[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_extra_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null

---
# X25519 Key Generation for Reality Protocol
# Generates keys if VLESS_REALITY inbound doesn't exist yet

- name: Check if X25519 keys already exist in Marzban
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_inbounds_check
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: DEBUG - Log API response details
  debug:
    msg:
      - "=== INBOUNDS API CHECK DEBUG ==="
      - "URL: {{ computed_api_url }}/inbounds"
      - "Status: {{ existing_inbounds_check.status | default('N/A') }}"
      - "Failed: {{ existing_inbounds_check.failed | default(false) }}"
      - "Content Type: {{ existing_inbounds_check.content | default('') | type_debug }}"
      - "JSON Type: {{ existing_inbounds_check.json | default('N/A') | type_debug }}"
      - "JSON Content: {{ existing_inbounds_check.json | default('N/A') }}"
      - "Response Body: {{ existing_inbounds_check.content | default('N/A') | truncate(500) }}"
  delegate_to: localhost
  run_once: yes

- name: Fail if API returned an error
  fail:
    msg: "API Request failed! Status: {{ existing_inbounds_check.status | default('N/A') }}. Body: {{ existing_inbounds_check.content | default('N/A') }}"
  when: existing_inbounds_check.failed | default(false)
  run_once: yes

- name: Set fact - check if VLESS_REALITY inbound exists
  set_fact:
    reality_inbound_exists: >-
      {{ existing_inbounds_check.json is defined and
         existing_inbounds_check.json | type_debug == 'list' and
         'VLESS_REALITY' in (existing_inbounds_check.json | map(attribute='tag') | list) }}
  delegate_to: localhost
  become: no
  run_once: yes

- name: DEBUG - Log reality_inbound_exists fact
  debug:
    msg:
      - "=== INBOUND EXISTS CHECK RESULT ==="
      - "reality_inbound_exists: {{ reality_inbound_exists }}"
      - "Will generate new keys: {{ not reality_inbound_exists }}"
  delegate_to: localhost
  run_once: yes

- name: Generate X25519 keys using xray command
  command: >
    docker run --rm {{ marzban_node_image }} xray x25519
  register: x25519_output
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes
  changed_when: true

- name: Parse X25519 private key
  set_fact:
    reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Parse X25519 public key
  set_fact:
    reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Generate random SHORT_ID (8 hex chars)
  set_fact:
    reality_short_id: "{{ '%08x' | format(65535 | random(seed=inventory_hostname) + (65535 | random(seed=now()) * 65536)) }}"
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Display generated keys
  debug:
    msg:
      - "Generated Private Key: {{ reality_private_key | default('N/A') }}"
      - "Generated Public Key: {{ reality_public_key | default('N/A') }}"
      - "Generated Short ID: {{ reality_short_id | default('N/A') }}"
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Use existing keys from environment if inbound exists
  set_fact:
    reality_private_key: "{{ REALITY_PRIVATE_KEY | default(lookup('env', 'REALITY_PRIVATE_KEY'), true) }}"
    reality_public_key: "{{ REALITY_PUBLIC_KEY | default(lookup('env', 'REALITY_PUBLIC_KEY'), true) }}"
    reality_short_id: "{{ REALITY_SHORT_ID | default(lookup('env', 'REALITY_SHORT_ID'), true) | default('abcd1234') }}"
  when: reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

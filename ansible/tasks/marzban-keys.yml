---
# X25519 Key Generation for Reality Protocol
# Generates keys if VLESS_REALITY inbound doesn't exist yet
# ==========================================

- name: Include key existence check tasks
  include_tasks: keys/check-existing.yml

- name: Include key generation tasks
  include_tasks: keys/generate-keys.yml
  when: not reality_inbound_exists

- name: Include use existing keys tasks
  include_tasks: keys/use-existing.yml
  when: reality_inbound_exists

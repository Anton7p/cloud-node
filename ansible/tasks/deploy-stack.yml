---
# Application Deployment Stack
# Consolidated: backup, configure, docker-auth, pull-image, stack-deploy, health-check, cleanup
# ==========================================

# --- BACKUP PHASE ---
- name: Check if existing .env exists
  stat:
    path: "{{ deploy_dir }}/.env"
  register: env_file_stat

- name: Backup existing .env if present
  copy:
    src: "{{ deploy_dir }}/.env"
    dest: "{{ backup_dir }}/.env.{{ ansible_date_time.epoch }}"
    remote_src: yes
    mode: '0600'
  when: env_file_stat.stat.exists

- name: Check if existing docker-compose.yml exists
  stat:
    path: "{{ deploy_dir }}/docker-compose.yml"
  register: compose_file_stat

- name: Backup existing docker-compose.yml if present
  copy:
    src: "{{ deploy_dir }}/docker-compose.yml"
    dest: "{{ backup_dir }}/docker-compose.yml.{{ ansible_date_time.epoch }}"
    remote_src: yes
    mode: '0644'
  when: compose_file_stat.stat.exists

# --- CONFIGURE PHASE ---
- name: Ensure deployment directory exists
  file:
    path: "{{ deploy_dir }}"
    state: directory
    mode: '0755'

- name: Create backup directory
  file:
    path: "{{ backup_dir }}"
    state: directory
    mode: '0755'

- name: Generate docker-compose.yml from template
  template:
    src: "../docker-compose.yml"
    dest: "{{ deploy_dir }}/docker-compose.yml"
    mode: '0644'
  register: compose_copy

- name: Remove old .env file to ensure clean generation
  file:
    path: "{{ deploy_dir }}/.env"
    state: absent

- name: Generate environment file from template
  template:
    src: templates/.env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: '0600'
    owner: root
    group: root
  register: env_generation

- name: Display .env generation status
  debug:
    msg: "Environment file generated at {{ deploy_dir }}/.env (changed: {{ env_generation.changed }})"

# --- DOCKER AUTH PHASE ---
- name: Create Docker config directory
  file:
    path: /root/.docker
    state: directory
    mode: '0700'

- name: Check Docker is installed and running
  command: docker version
  register: docker_check
  changed_when: false

- name: Display Docker status
  debug:
    msg: "Docker version: {{ docker_check.stdout | default('NOT INSTALLED') }}"

- name: Fail if Docker is not available
  fail:
    msg: "Docker is not installed or not running on {{ inventory_hostname }}"
  when: docker_check.rc != 0

# --- DOCKER LOGIN PHASE ---
- name: Docker login to GitHub Container Registry
  shell: |
    echo "{{ github_token }}" | docker login ghcr.io -u "{{ github_actor }}" --password-stdin
  no_log: true
  changed_when: true
  when: github_token is defined and github_token | length > 0

# --- PULL IMAGE PHASE ---
- name: Pull application image with SHA tag
  command: docker pull "{{ image_name }}"
  register: image_pull
  retries: 3
  delay: 10
  until: image_pull.rc == 0

- name: Verify image pulled successfully
  command: docker images "{{ image_name }}" --format "{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"
  register: image_verify
  changed_when: false

- name: Display pulled image
  debug:
    msg: "Successfully pulled image: {{ image_verify.stdout }}"

# --- STACK DEPLOY PHASE ---
- name: DEBUG - Starting stack deployment
  debug:
    msg:
      - "=== STACK DEPLOY START ==="
      - "Directory: {{ deploy_dir }}"
      - "Database exists check starting"

- name: Stop existing containers gracefully
  command: docker compose down --timeout 30
  args:
    chdir: "{{ deploy_dir }}"
  register: compose_down
  changed_when: compose_down.rc == 0

- name: DEBUG - Compose down result
  debug:
    msg: "Compose down exit code: {{ compose_down.rc }}"

# ============================================================================
# BOOT SEQUENCE STEP 1: Infrastructure (DB & Redis)
# ============================================================================
- name: Start infrastructure services (db, redis)
  command: docker compose up -d db redis
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_PASSWORD: "{{ db_password }}"
    REDIS_PASSWORD: "{{ redis_password | default('') }}"
  register: infra_up
  retries: 3
  delay: 5
  until: infra_up.rc == 0

- name: Wait for PostgreSQL to be ready
  command: docker compose exec -T db pg_isready -U postgres
  args:
    chdir: "{{ deploy_dir }}"
  register: pg_ready
  retries: 15
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

# ============================================================================
# BOOT SEQUENCE STEP 2: VPN Core (Marzban)
# ============================================================================
- name: Start VPN Core (Marzban)
  command: docker compose up -d marzban
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    VPN_ADMIN_USERNAME: "{{ vpn_admin_username }}"
    VPN_ADMIN_PASSWORD: "{{ vpn_admin_password }}"
  register: marzban_up
  retries: 3
  delay: 5
  until: marzban_up.rc == 0

- name: Wait for Marzban container to be healthy
  command: docker compose ps marzban --format "{{'{{.Health}}'}}"
  args:
    chdir: "{{ deploy_dir }}"
  register: marzban_health
  retries: 20
  delay: 5
  until: marzban_health.stdout is defined and 'healthy' in marzban_health.stdout | lower
  changed_when: false

# ============================================================================
# BOOT SEQUENCE STEP 3: Generate Reality Keys via Marzban API
# ============================================================================
- name: Setup Reality Keys via Marzban API and start bot
  include_tasks: tasks/setup-reality-keys.yml
  when: inventory_hostname in groups['master'] | default([inventory_hostname])

- name: Prune unused Docker images to free disk space
  command: docker image prune -f
  changed_when: true

# --- HEALTH CHECK PHASE ---
- name: DEBUG - Starting health checks
  debug:
    msg:
      - "=== HEALTH CHECK START ==="
      - "Waiting 30s for containers to stabilize..."

- name: Wait for containers to initialize
  pause:
    seconds: 30

- name: Check running containers
  command: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  register: container_status
  changed_when: false

- name: DEBUG - Display raw container status
  debug:
    msg: "Container Status:\n{{ container_status.stdout }}"

- name: Verify critical services are running
  command: docker ps --filter "name={{ item }}" --filter "status=running" --format "{% raw %}{{.Names}}{% endraw %}"
  register: service_check
  changed_when: false
  loop:
    - cloudnode-bot
    - cloudnode-db
    - cloudnode-redis
    - cloudnode-marzban

- name: DEBUG - Service check results
  debug:
    msg:
      - "Service check results:"
      - "{% for result in service_check.results %}  - {{ result.item }}: {{ 'RUNNING' if result.stdout else 'NOT FOUND' }}{% endfor %}"

- name: Identify failed services
  set_fact:
    failed_service_names: "{{ failed_service_names | default([]) + [item.item] }}"
  when: item.stdout | length == 0
  loop: "{{ service_check.results }}"

- name: DEBUG - Collecting logs for failed services
  debug:
    msg: "Failed services: {{ failed_service_names | default([]) | join(', ') }}"
  when: failed_service_names is defined and failed_service_names | length > 0

- name: Get Marzban container logs on failure
  command: docker compose logs marzban --tail 50
  args:
    chdir: "{{ deploy_dir }}"
  register: marzban_logs
  changed_when: false
  when: failed_service_names is defined and 'cloudnode-marzban' in failed_service_names

- name: DEBUG - Display marzban logs
  debug:
    msg: "Marzban container logs:\n{{ marzban_logs.stdout | default('No logs available') }}"
  when: marzban_logs is defined and marzban_logs.stdout is defined and marzban_logs.stdout | length > 0

- name: Fail if critical services not running
  fail:
    msg: "Deployment failed - critical services are not running: {{ failed_service_names | join(', ') }}. Check logs above."
  when: failed_service_names is defined and failed_service_names | length > 0

# --- CLEANUP PHASE ---
- name: Remove old Docker images
  shell: |
    docker image prune -af --filter "until=168h" || true
  register: image_prune
  changed_when: "'Total reclaimed space' in image_prune.stderr"

- name: Display cleanup results
  debug:
    msg: "{{ image_prune.stderr | default('No images to prune') }}"

- name: Logout from Docker registry
  command: docker logout {{ registry_url }}
  when: docker_login is succeeded

- name: Display deployment summary
  debug:
    msg: |
      ==========================================
      DEPLOYMENT SUCCESSFUL
      ==========================================
      Target Server: {{ inventory_hostname }}
      Image: {{ image_name }}:{{ image_tag }}
      Deployed At: {{ ansible_date_time.iso8601 }}
      Containers Running: {{ container_status.stdout_lines | length - 1 }}
      ==========================================

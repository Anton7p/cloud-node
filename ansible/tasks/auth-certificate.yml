---
# Authentication and Certificate Handling
# Consolidated: authenticate, fetch-cert, compare-cert
# ==========================================

# --- AUTHENTICATION TASKS ---
- name: Wait for Marzban API to be available
  uri:
    url: "{{ computed_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
    return_content: yes
    status_code: [200, 401, 403]
    timeout: 10
  register: auth_check
  retries: 30
  delay: 5
  until: auth_check.status is defined and (auth_check.status == 200 or auth_check.status == 401 or auth_check.status == 403)
  no_log: true
  # Run on target server where API is accessible (port 8000)
  become: false

- name: Attempt to create first admin (if auth returns 401)
  uri:
    url: "{{ computed_api_url }}/admin"
    method: POST
    body_format: json
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
      is_sudo: true
    return_content: yes
    status_code: [200, 201, 403]
    timeout: 10
  when: auth_check.status == 401
  register: create_admin_response
  no_log: true
  become: false

- name: Authenticate with Marzban Master API
  uri:
    url: "{{ computed_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
    return_content: yes
    status_code: 200
    timeout: 30
  register: auth_response
  no_log: true
  become: false
  retries: 5
  delay: 3
  until: auth_response.status == 200

- name: Display auth success
  debug:
    msg: "Successfully authenticated with Marzban Master at {{ computed_api_url }}"
  when: auth_response.status == 200

- name: Fail if authentication failed
  fail:
    msg: "Authentication failed. Status: {{ auth_response.status | default('unknown') }}"
  when: auth_response.status != 200

# --- CERTIFICATE FETCH TASKS ---
# Only fetch certificates for nodes, not master
# Master generates its own certificates, doesn't fetch them
- name: Fetch certificate from Marzban Master API
  uri:
    url: "{{ computed_api_url }}/node/certificate?node_id={{ node_id | default(1) }}"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200, 404, 422]
    timeout: 30
  register: cert_response
  become: false
  when: "'nodes' in group_names"  # Only for nodes, not master

- name: Debug certificate response
  debug:
    msg: "Certificate fetch status: {{ cert_response.status | default('skipped') }}. Certificate defined: {{ cert_response.json.certificate is defined | default(false) }}"
  when: "'nodes' in group_names"

- name: Fail if certificate endpoint returned 404
  fail:
    msg: "Certificate endpoint /node/settings not found (404)."
  when: 
    - "'nodes' in group_names"
    - cert_response.status == 404

- name: Fail if certificate not found in response
  fail:
    msg: "Certificate not found in API response."
  when: 
    - "'nodes' in group_names"
    - cert_response.status == 200
    - cert_response.json.certificate is not defined or cert_response.json.certificate == ""

- name: Save certificate locally on Runner
  copy:
    content: "{{ cert_response.json.certificate }}"
    dest: "/tmp/ssl_client_cert.pem"
    mode: '0644'
  when: 
    - "'nodes' in group_names"
    - cert_response.json.certificate is defined
  delegate_to: localhost
  become: false
  run_once: true

- name: Store certificate content as fact
  set_fact:
    new_certificate: "{{ cert_response.json.certificate }}"
  when: "'nodes' in group_names"
  delegate_to: localhost
  become: false
  run_once: true

# --- CERTIFICATE COMPARISON TASKS ---
- name: Check if certificate already exists on node
  stat:
    path: "{{ cert_file }}"
  register: existing_cert
  when: "'nodes' in group_names"

- name: Read existing certificate content from node
  slurp:
    src: "{{ cert_file }}"
  register: existing_cert_content
  when: 
    - "'nodes' in group_names"
    - existing_cert.stat.exists

- name: Set certificate changed fact
  set_fact:
    cert_changed: >-
      {{ not existing_cert.stat.exists or
         (existing_cert_content.content | b64decode) != new_certificate }}
  when: "'nodes' in group_names"
  delegate_to: localhost
  become: false
  run_once: true

---
# Authentication and certificate handling tasks
- name: Wait for Marzban API to be available
  uri:
    url: "{{ computed_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
    return_content: yes
    status_code: [200, 401, 403]
    timeout: 10
  register: auth_check
  retries: 30
  delay: 5
  until: auth_check.status is defined and (auth_check.status == 200 or auth_check.status == 401 or auth_check.status == 403)
  no_log: true
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Attempt to create first admin (if auth returns 401)
  uri:
    url: "{{ computed_api_url }}/admin"
    method: POST
    body_format: json
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
      is_sudo: true
    return_content: yes
    status_code: [200, 201, 403]
    timeout: 10
  when: auth_check.status == 401
  register: create_admin_response
  no_log: true
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Authenticate with Marzban Master API
  uri:
    url: "{{ computed_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ marzban_username }}"
      password: "{{ marzban_password }}"
    return_content: yes
    status_code: 200
    timeout: 30
  register: auth_response
  no_log: true
  delegate_to: localhost
  become: no
  run_once: yes
  retries: 5
  delay: 3
  until: auth_response.status == 200

- name: Display auth success
  debug:
    msg: "Successfully authenticated with Marzban Master at {{ computed_api_url }}"
  when: auth_response.status == 200
  delegate_to: localhost
  become: no
  run_once: yes

- name: Fail if authentication failed
  fail:
    msg: "Authentication failed with Marzban Master. Status: {{ auth_response.status | default('unknown') }}. Check VPN_ADMIN_USERNAME and VPN_ADMIN_PASSWORD."
  when: auth_response.status != 200
  delegate_to: localhost
  become: no
  run_once: yes

- name: Fetch SSL certificate from Master API
  uri:
    url: "{{ computed_api_url }}/node/settings"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200, 404]
    timeout: 30
  register: cert_response
  delegate_to: localhost
  become: no
  run_once: yes

- name: Full API Debug
  debug:
    msg: 
      - "Full URL: {{ computed_api_url }}/node/settings"
      - "Status Code: {{ cert_response.status }}"
      - "Response Body: {{ cert_response.content }}"
  delegate_to: localhost
  run_once: yes


- name: Debug certificate response
  debug:
    msg: "Certificate fetch status: {{ cert_response.status }}. Certificate defined: {{ cert_response.json.certificate is defined }}. Length: {{ cert_response.json.certificate | default('') | length }}"
  delegate_to: localhost
  become: no
  run_once: yes

- name: Fail if certificate endpoint returned 404
  fail:
    msg: "Certificate endpoint /node/settings not found (404). Please check your Marzban API version and configuration."
  when: cert_response.status == 404
  delegate_to: localhost
  become: no
  run_once: yes

- name: Fail if certificate not found in response
  fail:
    msg: "Certificate not found in Marzban API response. Response keys: {{ cert_response.json.keys() | default([]) }}"
  when: cert_response.status == 200 and (cert_response.json.certificate is not defined or cert_response.json.certificate == "")
  delegate_to: localhost
  become: no
  run_once: yes

- name: Save certificate locally on Runner
  copy:
    content: "{{ cert_response.json.certificate }}"
    dest: "/tmp/ssl_client_cert.pem"
    mode: '0644'
  when: cert_response.json.certificate is defined
  delegate_to: localhost
  become: no
  run_once: yes

- name: Store certificate content as fact
  set_fact:
    new_certificate: "{{ cert_response.json.certificate }}"
  delegate_to: localhost
  become: no
  run_once: yes

- name: Check if certificate already exists on node
  stat:
    path: "{{ cert_file }}"
  register: existing_cert

- name: Read existing certificate content from node
  slurp:
    src: "{{ cert_file }}"
  register: existing_cert_content
  when: existing_cert.stat.exists

- name: Set certificate changed fact
  set_fact:
    cert_changed: >-
      {{ not existing_cert.stat.exists or
         (existing_cert_content.content | b64decode) != new_certificate }}
  delegate_to: localhost
  become: no
  run_once: yes

# =============================================================================
# INBOUND SETUP - Create default VLESS + Reality inbound if not exists
# =============================================================================
- name: Check existing inbounds
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: inbounds_list
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Create default VLESS + Reality Inbound
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      tag: "VLESS_REALITY"
      protocol: "vless"
      listen: "0.0.0.0"
      port: 443
      settings:
        clients: []
        decryption: "none"
      stream_settings:
        network: "tcp"
        security: "reality"
        realitySettings:
          dest: "{{ domain_name }}:443"
          serverNames:
            - "{{ domain_name }}"
          privateKey: "{{ REALITY_PRIVATE_KEY | default(lookup('env', 'REALITY_PRIVATE_KEY'), true) | default(omit) }}"
          shortIds:
            - "{{ REALITY_SHORT_ID | default(lookup('env', 'REALITY_SHORT_ID'), true) | default('abcd1234') }}"
        tcpSettings:
          acceptProxyProtocol: false
      sniffing:
        enabled: true
        destOverride:
          - "http"
          - "tls"
    status_code: [201, 200, 409]
    timeout: 30
  when: inbounds_list.json is defined and inbounds_list.json | selectattr('tag', 'equalto', 'VLESS_REALITY') | list | length == 0
  register: inbound_create_result
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Display inbound creation status
  debug:
    msg: "VLESS_REALITY inbound created or already exists. Status: {{ inbound_create_result.status | default('skipped') }}"
  when: inbound_create_result is defined
  delegate_to: localhost
  become: no
  run_once: yes

# =============================================================================
# NODE REGISTRATION - Register node in Core API
# =============================================================================
- name: Get existing nodes from Core API
  uri:
    url: "{{ computed_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_nodes
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Check if current node already registered
  set_fact:
    node_already_registered: >-
      {{ existing_nodes.json is defined and
         existing_nodes.json | selectattr('address', 'equalto', inventory_hostname) | list | length > 0 }}
  delegate_to: localhost
  become: no

- name: Register node in Core API
  uri:
    url: "{{ computed_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname | replace('.', '-') }}"
      address: "{{ inventory_hostname }}"
      port: 62050
      certificate: "{{ new_certificate | default(cert_response.json.certificate) }}"
      id: "{{ inventory_hostname | hash('sha1') }}"
    status_code: [201, 200, 409]
    timeout: 30
  when: not node_already_registered | default(true)
  register: node_registration
  delegate_to: localhost
  become: no
  ignore_errors: yes

- name: Display node registration status
  debug:
    msg: "Node {{ inventory_hostname }} registered or already exists. Status: {{ node_registration.status | default('skipped') }}"
  delegate_to: localhost
  become: no

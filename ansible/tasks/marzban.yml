---
# Marzban Complete Setup - Consolidated Tasks
# Includes: Keys, Inbound, Bot Env, Node Registration, Node Deployment
# ==========================================

# ============================================================================
# SECTION 1: X25519 Key Generation for Reality Protocol
# ============================================================================

- name: Check if X25519 keys already exist in Marzban
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_inbounds_check
  delegate_to: localhost
  become: false
  run_once: true

- name: Set fact - check if VLESS_REALITY inbound exists
  set_fact:
    reality_inbound_exists: >-
      {{ existing_inbounds_check.json is defined and
         existing_inbounds_check.json | type_debug == 'list' and
         'VLESS_REALITY' in (existing_inbounds_check.json | map(attribute='tag') | list) }}
  delegate_to: localhost
  become: false
  run_once: true

- name: DEBUG - Log reality_inbound_exists fact
  debug:
    msg:
      - "reality_inbound_exists: {{ reality_inbound_exists }}"
      - "Will generate new keys: {{ not reality_inbound_exists }}"
  delegate_to: localhost
  run_once: true

- name: Generate X25519 keys using xray command
  command: >
    docker run --rm {{ marzban_node_image }} xray x25519
  register: x25519_output
  when: reality_inbound_exists is not defined or not reality_inbound_exists
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true

- name: Parse X25519 private key
  set_fact:
    reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and (reality_inbound_exists is not defined or not reality_inbound_exists)
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Parse X25519 public key
  set_fact:
    reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and (reality_inbound_exists is not defined or not reality_inbound_exists)
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Generate random SHORT_ID via openssl
  shell: openssl rand -hex 4
  register: openssl_short_id
  when: reality_inbound_exists is not defined or not reality_inbound_exists
  delegate_to: localhost
  become: false
  run_once: true

- name: Set reality_short_id fact
  set_fact:
    reality_short_id: "{{ openssl_short_id.stdout }}"
  when: reality_inbound_exists is not defined or not reality_inbound_exists
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

- name: Display generated keys
  debug:
    msg:
      - "Generated Private Key: {{ reality_private_key | default('N/A') }}"
      - "Generated Public Key: {{ reality_public_key | default('N/A') }}"
      - "Generated Short ID: {{ reality_short_id | default('N/A') }}"
  when: reality_inbound_exists is not defined or not reality_inbound_exists
  delegate_to: localhost
  run_once: true

- name: Use existing keys from environment if inbound exists
  set_fact:
    reality_private_key: "{{ REALITY_PRIVATE_KEY | default(lookup('env', 'REALITY_PRIVATE_KEY'), true) }}"
    reality_public_key: "{{ REALITY_PUBLIC_KEY | default(lookup('env', 'REALITY_PUBLIC_KEY'), true) }}"
    reality_short_id: "{{ REALITY_SHORT_ID | default(lookup('env', 'REALITY_SHORT_ID'), true) | default('abcd1234') }}"
  when: reality_inbound_exists
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true

# ============================================================================
# SECTION 2: VLESS Reality Inbound Creation
# ============================================================================

- name: Get current Xray core config
  uri:
    url: "{{ computed_api_url }}/core/config"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: true
    status_code: [200]
    timeout: 30
  register: core_config
  delegate_to: localhost
  become: false
  run_once: true

- name: Set fact - VLESS Reality inbound exists check
  set_fact:
    vless_reality_exists: >-
      {{ core_config.json is defined and
         core_config.json.inbounds is defined and
         core_config.json.inbounds | selectattr('tag', 'equalto', 'VLESS Reality TCP') | list | length > 0 }}
  delegate_to: localhost
  become: false

- name: DEBUG - Config check
  debug:
    msg:
      - "Current inbounds: {{ core_config.json.inbounds | default([]) | map(attribute='tag') | list }}"
      - "VLESS Reality exists: {{ vless_reality_exists }}"
  delegate_to: localhost
  become: false

- name: Ensure jq is installed on runner (for JSON manipulation)
  package:
    name: jq
    state: present
  delegate_to: localhost
  become: false
  run_once: true

- name: Prepare and apply VLESS Reality inbound
  block:
      - name: Create VLESS Reality inbound JSON file
        copy:
          content: |
            {
              "tag": "VLESS Reality TCP",
              "listen": "0.0.0.0",
              "port": 443,
              "protocol": "vless",
              "settings": {
                "clients": [],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp",
                "security": "reality",
                "realitySettings": {
                  "dest": "{{ domain_name }}:443",
                  "serverNames": ["{{ domain_name }}"],
                  "privateKey": "{{ reality_private_key }}",
                  "publicKey": "{{ reality_public_key }}",
                  "shortIds": ["{{ reality_short_id }}"]
                }
              },
              "sniffing": {
                "enabled": true,
                "destOverride": ["http", "tls"]
              }
            }
          dest: "/tmp/vless_reality_inbound.json"

      - name: Save current core config to file
        copy:
          content: "{{ core_config.json | to_nice_json }}"
          dest: "/tmp/current_core_config.json"

      - name: Build updated core config with new inbound
        shell: |
          cat /tmp/current_core_config.json | \
          jq --slurpfile inbound /tmp/vless_reality_inbound.json \
          '.inbounds = (.inbounds // []) + $inbound'
        register: updated_config_json
  delegate_to: localhost
  become: false
  when:
    - not vless_reality_exists | bool
    - reality_private_key is defined

- name: Update Xray core config with VLESS Reality
  uri:
    url: "{{ computed_api_url }}/core/config"
    method: PUT
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ updated_config_json.stdout }}"
    status_code: [200, 201, 204]
    timeout: 30
  when:
    - not vless_reality_exists | bool
    - reality_private_key is defined
    - updated_config_json.rc == 0
  register: config_update_result
  delegate_to: localhost
  become: false
  run_once: true

- name: Display config update status
  debug:
    msg: "VLESS Reality inbound added. Status: {{ config_update_result.status | default('skipped') }}"
  when: config_update_result is defined
  delegate_to: localhost
  become: false

# ============================================================================
# SECTION 3: Update Bot Environment Variables
# ============================================================================

- name: Update bot .env file on master server with Reality keys
  lineinfile:
    path: /var/www/cloudnode/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: yes
    mode: '0644'
  loop:
    - { key: "REALITY_PUBLIC_KEY", value: "{{ reality_public_key | default('') }}" }
    - { key: "REALITY_SHORT_ID", value: "{{ reality_short_id | default('') }}" }
    - { key: "MARZBAN_INBOUND_TAG", value: "VLESS_REALITY" }
  when: (reality_public_key | default('')) | length > 0
  become: true
  no_log: true

- name: Restart bot container to apply new env vars
  command: docker compose restart bot
  args:
    chdir: /var/www/cloudnode
  when:
    - (reality_public_key | default('')) | length > 0
    - "'master' in group_names"
  become: true

# ============================================================================
# SECTION 4: Node Registration in Marzban Core API
# ============================================================================

- name: Check if VLESS_REALITY inbound exists (non-blocking)
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: inbounds_check
  delegate_to: localhost
  become: false
  run_once: true

- name: Set fact - VLESS inbound exists (object format)
  set_fact:
    vless_inbound_exists: >-
      {{ inbounds_check.json is defined and
         inbounds_check.json is mapping and
         inbounds_check.json.vless is defined and
         inbounds_check.json.vless | length > 0 }}
  delegate_to: localhost
  become: false

- name: DEBUG - Inbound status
  debug:
    msg: "VLESS Reality inbound exists: {{ vless_inbound_exists | default(false) }}"
  delegate_to: localhost
  become: false

- name: Get existing nodes from Core API
  uri:
    url: "{{ computed_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_nodes
  delegate_to: localhost
  become: false
  run_once: true

- name: Check if current node already registered
  set_fact:
    node_already_registered: >-
      {{ existing_nodes.json is defined and
         existing_nodes.json | selectattr('address', 'equalto', inventory_hostname) | list | length > 0 }}
  delegate_to: localhost
  become: false

- name: Generate API prefix for node
  set_fact:
    node_api_prefix: "{{ inventory_hostname | hash('sha1') | regex_replace('^(.{8}).*$', '\\1') }}"
  delegate_to: localhost
  run_once: false

- name: DEBUG - Show node registration data
  debug:
    msg:
      - "Registering node: {{ inventory_hostname }}"
      - "API prefix: {{ node_api_prefix }}"
      - "Certificate defined: {{ new_certificate is defined or cert_response.json.certificate is defined }}"
  delegate_to: localhost
  run_once: false

- name: Generate random password for node connection
  set_fact:
    node_connection_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  delegate_to: localhost
  run_once: false
  when: not node_already_registered | default(true)

- name: Register node in Core API
  uri:
    url: "{{ computed_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname | replace('.', '-') }}"
      address: "{{ inventory_hostname }}"
      port: "{{ service_port | default(62050) }}"
      api_prefix: "{{ node_api_prefix }}"
      certificate: "{{ new_certificate | default(cert_response.json.certificate | default('')) }}"
    status_code: [201, 200, 409]
    timeout: 30
  when: not node_already_registered | default(true)
  register: node_registration
  delegate_to: localhost
  become: false
  no_log: true

- name: Display node registration status
  debug:
    msg: "Node {{ inventory_hostname }} registered or already exists. Status: {{ node_registration.status | default('skipped') }}"
  delegate_to: localhost
  become: false

# ============================================================================
# SECTION 5: Marzban Node Deployment
# ============================================================================

- name: Check if marzban-node container is running
  command: docker ps -q -f name=marzban-node
  register: container_check
  changed_when: false

- name: Set fresh install fact
  set_fact:
    is_fresh_install: "{{ container_check.stdout == '' }}"

- name: Set restart required fact
  set_fact:
    restart_required: "{{ is_fresh_install or hostvars['localhost'].cert_changed | default(false) }}"

- name: Remove old certificate file (migration from ssl_cert.pem to ssl_client_cert.pem)
  file:
    path: "{{ node_var_dir }}/ssl_cert.pem"
    state: absent

- name: Check if certificate file exists
  stat:
    path: "{{ cert_file }}"
  register: cert_file_check

- name: Copy SSL certificate from Runner to node
  copy:
    src: "/tmp/ssl_client_cert.pem"
    dest: "{{ cert_file }}"
    mode: '0644'
    owner: root
    group: root
  when: not cert_file_check.stat.exists or hostvars['localhost'].cert_changed | default(false)

- name: Verify certificate file exists after copy
  stat:
    path: "{{ cert_file }}"
  register: cert_file_check_after

- name: Fail if certificate file not found after copy
  fail:
    msg: "Certificate file not found at {{ cert_file }}"
  when: not cert_file_check_after.stat.exists

- name: Create Docker Compose file for Marzban Node
  copy:
    dest: "{{ node_dir }}/docker-compose.yml"
    content: |
      services:
        marzban-node:
          image: {{ marzban_node_image }}
          container_name: marzban-node
          restart: always
          network_mode: host
          environment:
            - SERVICE_PORT={{ service_port | default(62050) }}
            - XRAY_API_PORT={{ xray_api_port | default(62051) }}
            - SSL_CLIENT_CERT_FILE=/var/lib/marzban-node/ssl_client_cert.pem
          volumes:
            - {{ node_var_dir }}:/var/lib/marzban-node:rw
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
    mode: '0644'
    owner: root
    group: root
  register: compose_file

- name: Validate Docker Compose configuration
  command: docker compose config
  args:
    chdir: "{{ node_dir }}"
  register: compose_config
  changed_when: false

- name: Pull latest Marzban Node image
  command: docker compose pull
  args:
    chdir: "{{ node_dir }}"
  when: not is_fresh_install

- name: Start Marzban Node (fresh install or restart required)
  command: docker compose up -d
  args:
    chdir: "{{ node_dir }}"
  when: restart_required or hostvars['localhost'].cert_changed | default(false)

- name: Restart Marzban Node (certificate changed, compose updated)
  command: docker compose restart
  args:
    chdir: "{{ node_dir }}"
  when:
    - not restart_required
    - compose_file is changed

- name: Check Marzban Node container status
  command: docker ps -q -f name=marzban-node
  register: container_status
  changed_when: false

# --- HEALTH CHECK ---
- name: Wait for container to exist
  shell: |
    for i in {1..15}; do
      docker ps -q -f name=marzban-node | grep -q . && exit 0
      sleep 2
    done
    exit 1
  register: container_exists
  retries: 3
  delay: 5
  until: container_exists.rc == 0
  when: restart_required or compose_file is changed

- name: Wait for Marzban Node health endpoint
  uri:
    url: "http://localhost:{{ service_port | default(62050) }}/health"
    method: GET
    status_code: 200
  register: health_check
  retries: 30
  delay: 5
  until: health_check.status == 200
  when: restart_required or compose_file is changed or container_status.stdout != ''
  ignore_errors: true

- name: Get container logs on health check failure
  command: docker logs marzban-node --tail 50
  register: container_logs
  changed_when: false
  when: health_check is failed

- name: Display container logs on failure
  debug:
    msg: "Marzban Node logs:\n{{ container_logs.stdout | default('No logs available') }}"
  when: health_check is failed and container_logs.stdout is defined

- name: Fail if health check failed
  fail:
    msg: "Marzban Node health check failed. Check logs above."
  when: health_check is failed

- name: Prune old Docker images
  command: docker image prune -f
  changed_when: true

- name: Display deployment status
  debug:
    msg: |
      Marzban Node deployment completed on {{ inventory_hostname }}!
      - Node directory: {{ node_dir }}
      - Service port: {{ service_port | default(62050) }}
      - Xray API port: {{ xray_api_port | default(62051) }}
      - SSL certificate: {{ 'saved to ' ~ cert_file }}
      - Certificate changed: {{ hostvars['localhost'].cert_changed | default(false) }}
      - Container restarted: {{ restart_required or (compose_file is changed) }}
      - Health check: {{ 'PASSED' if health_check.status is defined and health_check.status == 200 else 'SKIPPED/PENDING' }}
      - Deployment type: {{ 'Fresh install' if is_fresh_install else 'Idempotent update' }}

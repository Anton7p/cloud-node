---
# Nginx Configuration for Subscription Endpoint
# ==========================================

- name: Set SSL certificate existence fact
  set_fact:
    ssl_cert_exists: "{{ (ssl_cert_stat_after.stat.exists | default(false)) or (ssl_cert_stat.stat.exists | default(false)) }}"

- name: Deploy nginx subscription config
  template:
    src: nginx-subscription.conf.j2
    dest: /etc/nginx/sites-available/subscription.conf
    mode: '0644'
  vars:
    ssl_cert_exists: "{{ ssl_cert_exists }}"

- name: Enable subscription site
  file:
    src: /etc/nginx/sites-available/subscription.conf
    dest: /etc/nginx/sites-enabled/subscription.conf
    state: link

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Reload nginx configuration
  service:
    name: nginx
    state: reloaded

- name: Validate nginx configuration
  command: nginx -t
  changed_when: false

---
# Update Bot Environment Variables on Master Server
# Updates .env file with Reality keys for subscription URLs

- name: Update bot .env file on master server
  lineinfile:
    path: /var/www/cloudnode/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: yes
    mode: '0644'
  loop:
    - { key: "REALITY_PUBLIC_KEY", value: "{{ reality_public_key | default(REALITY_PUBLIC_KEY | default('')) }}" }
    - { key: "REALITY_SHORT_ID", value: "{{ reality_short_id | default(REALITY_SHORT_ID | default('abcd1234')) }}" }
    - { key: "MARZBAN_INBOUND_TAG", value: "VLESS_REALITY" }
  when: reality_public_key is defined or REALITY_PUBLIC_KEY is defined
  delegate_to: "{{ groups['master'][0] | default('localhost') }}"
  become: yes
  ignore_errors: yes
  no_log: true

- name: Restart bot container to apply new env vars
  command: docker compose restart bot
  args:
    chdir: /var/www/cloudnode
  when: reality_public_key is defined
  delegate_to: "{{ groups['master'][0] | default('localhost') }}"
  become: yes
  ignore_errors: yes

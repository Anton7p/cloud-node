---
# Marzban Node Deployment (Node-specific)
# ==========================================

- name: Check if marzban-node container is running
  command: docker ps -q -f name=marzban-node
  register: container_check
  changed_when: false

- name: Set fresh install fact
  set_fact:
    is_fresh_install: "{{ container_check.stdout == '' }}"

- name: Set restart required fact
  set_fact:
    restart_required: "{{ is_fresh_install or cert_changed | default(false) }}"

- name: DEBUG - Container state
  debug:
    msg:
      - "container_check.stdout: '{{ container_check.stdout }}'"
      - "is_fresh_install: {{ is_fresh_install }}"
      - "restart_required: {{ restart_required }}"
      - "cert_changed: {{ cert_changed | default('UNDEFINED') }}"

- name: Remove old certificate file (migration from ssl_cert.pem to ssl_client_cert.pem)
  file:
    path: "{{ node_var_dir }}/ssl_cert.pem"
    state: absent

- name: Check if certificate file exists
  stat:
    path: "{{ cert_file }}"
  register: cert_file_check

- name: Ensure certificate directory exists
  file:
    path: "{{ node_var_dir }}"
    state: directory
    mode: '0755'
    owner: root
    group: root

- name: Copy SSL certificate from Runner to node
  copy:
    src: "/tmp/ssl_client_cert.pem"
    dest: "{{ cert_file }}"
    mode: '0644'
    owner: root
    group: root
  when: not cert_file_check.stat.exists or cert_changed | default(false)

- name: Verify certificate file exists after copy
  stat:
    path: "{{ cert_file }}"
  register: cert_file_check_after

- name: Fail if certificate file not found after copy
  fail:
    msg: "Certificate file not found at {{ cert_file }}"
  when: not cert_file_check_after.stat.exists

- name: Create Docker Compose file for Marzban Node
  copy:
    dest: "{{ node_dir }}/docker-compose.yml"
    content: |
      services:
        marzban-node:
          image: {{ marzban_node_image }}
          container_name: marzban-node
          restart: always
          network_mode: host
          environment:
            - SSL_CLIENT_CERT_FILE=/var/lib/marzban-node/ssl_client_cert.pem
            - SERVICE_PROTOCOL=rest
          volumes:
            - {{ node_var_dir }}:/var/lib/marzban-node:rw
          logging:
            driver: "json-file"
            options:
              max-size: "10m"
              max-file: "3"
    mode: '0644'
    owner: root
    group: root
  register: compose_file

- name: Validate Docker Compose configuration
  command: docker compose config
  args:
    chdir: "{{ node_dir }}"
  register: compose_config
  changed_when: false

- name: Pull latest Marzban Node image
  command: docker compose pull
  args:
    chdir: "{{ node_dir }}"
  when: not is_fresh_install

- name: Start Marzban Node (fresh install or restart required)
  command: docker compose up -d
  args:
    chdir: "{{ node_dir }}"
  when: restart_required or hostvars['localhost'].cert_changed | default(false)

- name: Restart Marzban Node (certificate changed, compose updated)
  command: docker compose restart
  args:
    chdir: "{{ node_dir }}"
  when:
    - not restart_required
    - compose_file is changed

- name: Check Marzban Node container status
  command: docker ps -q -f name=marzban-node
  register: container_status
  changed_when: false

# --- HEALTH CHECK ---
- name: Wait for container to exist
  shell: |
    for i in {1..15}; do
      docker ps -q -f name=marzban-node | grep -q . && exit 0
      sleep 2
    done
    exit 1
  register: container_exists
  retries: 3
  delay: 5
  until: container_exists.rc == 0
  when: restart_required or compose_file is changed

- name: Wait for Marzban Node to be running
  shell: docker ps -q -f name=marzban-node -f status=running
  register: container_running
  retries: 10
  delay: 3
  until: container_running.stdout | length > 0
  when: container_status.stdout | length > 0
  changed_when: false

- name: Display container status
  debug:
    msg: "Marzban Node container is running on {{ inventory_hostname }}"

- name: Prune old Docker images
  command: docker image prune -f
  changed_when: true

- name: Display deployment status
  debug:
    msg: |
      Marzban Node deployment completed on {{ inventory_hostname }}!
      - Node directory: {{ node_dir }}
      - Service port: {{ service_port | default(62050) }}
      - Xray API port: {{ xray_api_port | default(62051) }}
      - SSL certificate: {{ 'saved to ' ~ cert_file }}
      - Certificate changed: {{ hostvars['localhost'].cert_changed | default(false) }}
      - Container restarted: {{ restart_required or (compose_file is changed) }}
      - Health check: {{ 'PASSED' if health_check.status is defined and health_check.status == 200 else 'SKIPPED/PENDING' }}
      - Deployment type: {{ 'Fresh install' if is_fresh_install else 'Idempotent update' }}

---
# Bot Environment Variables Update (Master-specific)
# ==========================================

- name: Update bot .env file on master server with Reality keys
  lineinfile:
    path: /var/www/cloudnode/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: yes
    mode: '0644'
  loop:
    - { key: "REALITY_PUBLIC_KEY", value: "{{ ansible_facts.reality_public_key | default('') }}" }
    - { key: "REALITY_SHORT_ID", value: "{{ ansible_facts.reality_short_id | default('') }}" }
    - { key: "MARZBAN_INBOUND_TAG", value: "VLESS TCP REALITY" }
  when: (ansible_facts.reality_public_key | default('')) | length > 0
  become: true
  no_log: true

- name: Restart bot container to apply new env vars
  command: docker compose restart bot
  args:
    chdir: /var/www/cloudnode
  when: (ansible_facts.reality_public_key | default('')) | length > 0
  become: true

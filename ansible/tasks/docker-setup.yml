---
# Docker installation and configuration tasks
- name: Check if Docker is installed
  command: docker --version
  register: docker_check
  changed_when: false
  ignore_errors: true

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == "Debian"

- name: Remove conflicting packages
  apt:
    name:
      - containerd
      - docker.io
      - docker-compose
      - podman-docker
    state: absent
    purge: yes
  when: ansible_facts['os_family'] == "Debian"

- name: DEBUG - OS Family check
  debug:
    msg: "OS Family: {{ ansible_facts['os_family'] | default('unknown') }}"

- name: Install prerequisites for Docker
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - iptables
    state: present
  when: ansible_facts['os_family'] == "Debian"

- name: DEBUG - Docker check result
  debug:
    msg: "Docker check rc={{ docker_check.rc | default('undefined') }}, stdout={{ docker_check.stdout | default('none') }}"

- name: Install Docker using official script
  shell: |
    curl -fsSL https://get.docker.com -o get-docker.sh
    sh get-docker.sh
    rm get-docker.sh
  args:
    creates: /usr/bin/docker
  when:
    - docker_check.rc is defined
    - docker_check.rc != 0
    - ansible_facts['os_family'] == "Debian"

- name: Check if Docker service exists
  command: systemctl list-unit-files docker.service
  register: docker_service_check
  changed_when: false
  ignore_errors: true

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started
  when: docker_service_check.rc == 0
  ignore_errors: true

- name: Add root user to docker group
  user:
    name: root
    groups: docker
    append: yes
  ignore_errors: true

- name: Ensure Docker Compose V2 plugin directory exists
  file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Create docker-compose symlink for compatibility
  file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
    force: yes

- name: Ensure Docker daemon.json exists
  copy:
    content: |
      {
        "iptables": true,
        "ip-forward": true
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Configure DOCKER-USER chain to respect UFW
  shell: |
    iptables -N DOCKER-USER 2>/dev/null || true
    iptables -F DOCKER-USER 2>/dev/null || true
    iptables -I DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    iptables -I DOCKER-USER -i docker0 -j ACCEPT
    iptables -I DOCKER-USER -i br-+ -j ACCEPT
    iptables -A DOCKER-USER -j RETURN

# Note: Handler 'restart docker' is defined in deploy_node.yml handlers section

---
# Docker Firewall Protection - Master-specific
# ==========================================

- name: Drop all traffic to port 8000 in DOCKER-USER chain
  shell: |
    iptables -C DOCKER-USER -p tcp --dport 8000 -j DROP 2>/dev/null || \
    iptables -I DOCKER-USER -p tcp --dport 8000 -j DROP

- name: Allow infrastructure IPs to port 8000 in DOCKER-USER chain
  shell: |
    iptables -C DOCKER-USER -p tcp -s {{ item | trim }} --dport 8000 -j ACCEPT 2>/dev/null || \
    iptables -I DOCKER-USER -p tcp -s {{ item | trim }} --dport 8000 -j ACCEPT
  loop: "{{ infrastructure_ips | default([]) }}"
  when:
    - item | trim | length > 0
    - item | trim is match('^[0-9]+\\.[0-9]+\\.[0-9]+\\.[0-9]+(/[0-9]+)?$')
  ignore_errors: true

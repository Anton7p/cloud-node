---
# UFW Firewall Setup - Common for both master and node
# ==========================================

- name: Install UFW
  apt:
    name: ufw
    state: present
    update_cache: yes
  when: ansible_facts['os_family'] == "Debian"

- name: Reset UFW to clean state
  ufw:
    state: reset

- name: Set UFW default incoming policy to deny
  ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy to allow
  ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH (port 22) from anywhere
  ufw:
    rule: allow
    port: '22'
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled

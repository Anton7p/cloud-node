---
# Docker Setup - Common for both master and node
# ==========================================

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Remove conflicting packages
  apt:
    name:
      - containerd
      - docker.io
      - docker-compose
      - podman-docker
    state: absent
    purge: yes

- name: Install prerequisites for Docker
  apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
      - iptables
    state: present

- name: Install Docker using official script
  shell: |
    curl -fsSL https://get.docker.com -o get-docker.sh
    sh get-docker.sh
    rm get-docker.sh
  args:
    creates: /usr/bin/docker

- name: Enable and start Docker service
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add root user to docker group
  user:
    name: root
    groups: docker
    append: yes

- name: Ensure Docker Compose V2 plugin directory exists
  file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Create docker-compose symlink for compatibility
  file:
    src: /usr/libexec/docker/cli-plugins/docker-compose
    dest: /usr/local/bin/docker-compose
    state: link
    force: yes

- name: Ensure Docker daemon.json exists
  copy:
    content: |
      {
        "iptables": true,
        "ip-forward": true
      }
    dest: /etc/docker/daemon.json
    mode: '0644'
  notify: restart docker

- name: Configure DOCKER-USER chain to respect UFW
  shell: |
    iptables -N DOCKER-USER 2>/dev/null || true
    iptables -F DOCKER-USER 2>/dev/null || true
    iptables -I DOCKER-USER -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT
    iptables -I DOCKER-USER -i docker0 -j ACCEPT
    iptables -I DOCKER-USER -i br-+ -j ACCEPT
    iptables -A DOCKER-USER -j RETURN

- name: Verify Docker installation
  command: docker --version
  register: docker_version
  changed_when: false

- name: Verify Docker Compose installation
  command: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Display Docker versions
  debug:
    msg:
      - "Docker: {{ docker_version.stdout }}"
      - "Docker Compose: {{ docker_compose_version.stdout }}"

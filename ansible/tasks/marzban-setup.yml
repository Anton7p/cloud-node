---
# Marzban Core API Setup - Orchestration file
# Includes all sub-tasks for complete Marzban setup

- name: DEBUG - Entering Marzban setup flow
  debug:
    msg:
      - "=== MARZBAN SETUP FLOW START ==="
      - "API URL: {{ computed_api_url }}"
      - "Domain: {{ domain_name }}"
      - "Auth token defined: {{ auth_response.json.access_token is defined }}"
  delegate_to: localhost
  run_once: true

# 1. Generate X25519 keys for Reality protocol
- name: Setup X25519 keys
  include_tasks: marzban-keys.yml

# 2. Create VLESS + Reality Inbound
- name: Create VLESS Reality Inbound
  include_tasks: marzban-inbound.yml

# 3. Update bot environment variables
- name: Update bot .env with keys
  include_tasks: marzban-bot-env.yml

# 4. Register node in Core API (after Inbound is ready)
- name: Register node in Core
  include_tasks: marzban-register-node.yml

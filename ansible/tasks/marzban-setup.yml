---
# Marzban Core API setup - Inbound creation and Node registration
# This task runs after authentication and certificate handling

# =============================================================================
# X25519 KEY GENERATION - Generate Reality keys if not exists
# =============================================================================
- name: Check if X25519 keys already exist in Marzban
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_inbounds_check
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Set fact - check if VLESS_REALITY inbound exists
  set_fact:
    reality_inbound_exists: >-
      {{ existing_inbounds_check.json is defined and
         existing_inbounds_check.json | selectattr('tag', 'equalto', 'VLESS_REALITY') | list | length > 0 }}
  delegate_to: localhost
  become: no
  run_once: yes

- name: Generate X25519 keys using xray command
  command: >
    docker run --rm {{ marzban_node_image }} xray x25519
  register: x25519_output
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes
  changed_when: true

- name: Parse X25519 private key
  set_fact:
    reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Parse X25519 public key
  set_fact:
    reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Generate random SHORT_ID (8 hex chars)
  set_fact:
    reality_short_id: "{{ '%08x' | format(65535 | random(seed=inventory_hostname) + (65535 | random(seed=now()) * 65536)) }}"
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Display generated keys
  debug:
    msg:
      - "Generated Private Key: {{ reality_private_key | default('N/A') }}"
      - "Generated Public Key: {{ reality_public_key | default('N/A') }}"
      - "Generated Short ID: {{ reality_short_id | default('N/A') }}"
  when: not reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

- name: Use existing keys from environment if inbound exists
  set_fact:
    reality_private_key: "{{ REALITY_PRIVATE_KEY | default(lookup('env', 'REALITY_PRIVATE_KEY'), true) }}"
    reality_public_key: "{{ REALITY_PUBLIC_KEY | default(lookup('env', 'REALITY_PUBLIC_KEY'), true) }}"
    reality_short_id: "{{ REALITY_SHORT_ID | default(lookup('env', 'REALITY_SHORT_ID'), true) | default('abcd1234') }}"
  when: reality_inbound_exists
  delegate_to: localhost
  become: no
  run_once: yes

# =============================================================================
# INBOUND SETUP - Create default VLESS + Reality inbound if not exists
# =============================================================================
- name: Create default VLESS + Reality Inbound
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      tag: "VLESS_REALITY"
      protocol: "vless"
      listen: "0.0.0.0"
      port: 443
      settings:
        clients: []
        decryption: "none"
      stream_settings:
        network: "tcp"
        security: "reality"
        realitySettings:
          dest: "{{ domain_name }}:443"
          serverNames:
            - "{{ domain_name }}"
          privateKey: "{{ reality_private_key }}"
          publicKey: "{{ reality_public_key }}"
          shortIds:
            - "{{ reality_short_id }}"
        tcpSettings:
          acceptProxyProtocol: false
      sniffing:
        enabled: true
        destOverride:
          - "http"
          - "tls"
    status_code: [201, 200, 409]
    timeout: 30
  when: not reality_inbound_exists and reality_private_key is defined
  register: inbound_create_result
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Display inbound creation status
  debug:
    msg: "VLESS_REALITY inbound created or already exists. Status: {{ inbound_create_result.status | default('skipped') }}"
  when: inbound_create_result is defined
  delegate_to: localhost
  become: no
  run_once: yes

# =============================================================================
# UPDATE BOT ENV - Update .env file on master server with Reality keys
# =============================================================================
- name: Update bot .env file on master server
  lineinfile:
    path: /var/www/cloudnode/.env
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: yes
    mode: '0644'
  loop:
    - { key: "REALITY_PUBLIC_KEY", value: "{{ reality_public_key | default(REALITY_PUBLIC_KEY | default('')) }}" }
    - { key: "REALITY_SHORT_ID", value: "{{ reality_short_id | default(REALITY_SHORT_ID | default('abcd1234')) }}" }
    - { key: "MARZBAN_INBOUND_TAG", value: "VLESS_REALITY" }
  when: reality_public_key is defined or REALITY_PUBLIC_KEY is defined
  delegate_to: "{{ groups['master'][0] | default('localhost') }}"
  become: yes
  ignore_errors: yes

- name: Restart bot container to apply new env vars
  command: docker compose restart bot
  args:
    chdir: /var/www/cloudnode
  when: reality_public_key is defined
  delegate_to: "{{ groups['master'][0] | default('localhost') }}"
  become: yes
  ignore_errors: yes

# =============================================================================
# NODE REGISTRATION - Register node in Core API (after Inbound created)
# =============================================================================
- name: Wait for Inbound to be ready before node registration
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: inbounds_ready_check
  until: inbounds_ready_check.json is defined and (inbounds_ready_check.json | selectattr('tag', 'equalto', 'VLESS_REALITY') | list | length > 0)
  retries: 10
  delay: 3
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Get existing nodes from Core API
  uri:
    url: "{{ computed_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_nodes
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Check if current node already registered
  set_fact:
    node_already_registered: >-
      {{ existing_nodes.json is defined and
         existing_nodes.json | selectattr('address', 'equalto', inventory_hostname) | list | length > 0 }}
  delegate_to: localhost
  become: no

- name: Register node in Core API
  uri:
    url: "{{ computed_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname | replace('.', '-') }}"
      address: "{{ inventory_hostname }}"
      port: 62050
      certificate: "{{ new_certificate | default(cert_response.json.certificate) }}"
      id: "{{ inventory_hostname | hash('sha1') }}"
    status_code: [201, 200, 409]
    timeout: 30
  when: not node_already_registered | default(true)
  register: node_registration
  delegate_to: localhost
  become: no
  ignore_errors: yes

- name: Display node registration status
  debug:
    msg: "Node {{ inventory_hostname }} registered or already exists. Status: {{ node_registration.status | default('skipped') }}"
  delegate_to: localhost
  become: no

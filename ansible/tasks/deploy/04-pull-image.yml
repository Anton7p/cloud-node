---
# Application Deployment: Docker Image Pull
# ==========================================

- name: Pull latest application image
  docker_image:
    name: "{{ image_name }}"
    tag: "{{ image_tag }}"
    source: pull
    force_source: yes
  register: image_pull
  retries: 3
  delay: 10
  until: image_pull is succeeded

- name: Verify image pulled successfully
  command: docker images "{{ image_name }}:{{ image_tag }}" --format "{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}"
  register: image_verify
  changed_when: false

- name: Display pulled image
  debug:
    msg: "Successfully pulled image: {{ image_verify.stdout }}"

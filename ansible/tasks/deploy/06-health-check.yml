---
# Application Deployment: Health Checks
# ==========================================

- name: Wait for containers to initialize
  pause:
    seconds: 30

- name: Check running containers
  command: docker ps --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  register: container_status
  changed_when: false

- name: Display container status
  debug:
    msg: "Container Status:\n{{ container_status.stdout }}"

- name: Verify critical services are running
  command: docker ps --filter "name={{ item }}" --filter "status=running" --format "{% raw %}{{.Names}}{% endraw %}"
  register: service_check
  changed_when: false
  loop:
    - cloudnode-bot
    - cloudnode-db
    - cloudnode-redis
    - cloudnode-marzban

- name: Identify failed services
  set_fact:
    failed_service_names: "{{ failed_service_names | default([]) + [item.item] }}"
  when: item.stdout | length == 0
  loop: "{{ service_check.results }}"

- name: Get bot container logs on failure
  command: docker compose logs bot --tail 50
  args:
    chdir: "{{ deploy_dir }}"
  register: bot_logs
  changed_when: false
  ignore_errors: yes
  when: failed_service_names is defined and 'cloudnode-bot' in failed_service_names

- name: Display bot logs on failure
  debug:
    msg: "Bot container logs:\n{{ bot_logs.stdout | default('No logs available') }}"
  when: bot_logs is defined and bot_logs.stdout is defined and bot_logs.stdout | length > 0

- name: DEBUG - Get bot logs for diagnostics
  shell: docker logs cloudnode-bot 2>&1 | tail -100
  register: diagnostic_logs
  ignore_errors: yes

- name: DEBUG - Show bot diagnostic logs
  debug:
    var: diagnostic_logs.stdout
  when: diagnostic_logs is defined

- name: DEBUG - Show docker-compose ps output
  shell: docker ps -a --filter name=cloudnode --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
  register: docker_ps_output
  ignore_errors: yes

- name: DEBUG - Show container statuses
  debug:
    var: docker_ps_output.stdout

- name: Fail if critical services not running
  fail:
    msg: "Deployment failed - critical services are not running: {{ failed_service_names | join(', ') }}. Check logs above."
  when: failed_service_names is defined and failed_service_names | length > 0

- name: Verify bot health endpoint (if available)
  uri:
    url: "http://localhost:3000/health"
    method: GET
    status_code: [200, 404]
  register: health_check
  ignore_errors: yes
  retries: 5
  delay: 10

- name: Get bot container logs on health check failure
  shell: docker logs cloudnode-bot 2>&1 | tail -50
  register: bot_logs_failure
  ignore_errors: yes
  when: health_check is failed or health_check.status == -1

- name: DEBUG - Bot container logs on failure
  debug:
    var: bot_logs_failure.stdout
  when: bot_logs_failure is defined and bot_logs_failure.stdout is defined

- name: Get bot container status
  shell: docker ps -a | grep cloudnode-bot
  register: bot_container_status
  ignore_errors: yes

- name: DEBUG - Bot container status
  debug:
    var: bot_container_status.stdout

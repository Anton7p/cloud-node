---
# Application Deployment: Stack Deployment
# ==========================================

- name: DEBUG - Starting stack deployment
  debug:
    msg:
      - "=== STACK DEPLOY START ==="
      - "Directory: {{ deploy_dir }}"
      - "Database exists check starting"

- name: Stop existing containers gracefully
  command: docker compose down --timeout 30
  args:
    chdir: "{{ deploy_dir }}"
  register: compose_down
  changed_when: compose_down.rc == 0

- name: DEBUG - Compose down result
  debug:
    msg: "Compose down exit code: {{ compose_down.rc }}"

- name: DEBUG - Starting database and Redis
  debug:
    msg: "Starting database initialization..."

- name: Start database and Redis first (for DB initialization)
  command: docker compose up -d db redis
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_PASSWORD: "{{ db_password }}"
  register: db_start
  retries: 3
  delay: 3
  until: db_start.rc == 0

- name: Wait for PostgreSQL to be ready
  command: docker compose exec -T db pg_isready -U postgres
  args:
    chdir: "{{ deploy_dir }}"
  register: pg_ready
  retries: 10
  delay: 3
  until: pg_ready.rc == 0
  changed_when: false

- name: Create database if not exists
  shell: |
    docker compose exec -T db psql -U postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'cloudnode'" | grep -q 1 || \
    docker compose exec -T db psql -U postgres -c "CREATE DATABASE cloudnode;"
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_PASSWORD: "{{ db_password }}"
  register: db_create
  changed_when: "'CREATE DATABASE' in db_create.stdout | default('')"

- name: Display database creation status
  debug:
    msg: "Database 'cloudnode' status: {{ 'CREATED' if db_create.changed else 'EXISTS or FAILED' }}"

- name: Start application stack (all services)
  command: docker compose up -d
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_PASSWORD: "{{ db_password }}"
    TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token }}"
    ENCRYPTION_KEY: "{{ encryption_key }}"
    DOCKER_IMAGE_NAME: "{{ image_name }}"
    REDIS_PASSWORD: "{{ redis_password | default('') }}"
    MARZBAN_URL: "http://marzban:8000"
    VPN_ADMIN_USERNAME: "{{ vpn_admin_username }}"
    VPN_ADMIN_PASSWORD: "{{ vpn_admin_password }}"
    INFRASTRUCTURE_IP_LIST: "{{ infrastructure_ip_list | default('') }}"
    DOMAIN_NAME: "{{ domain_name }}"
    REALITY_PUBLIC_KEY: "{{ reality_public_key | default('initial_placeholder_key_change_me') }}"
    REALITY_SHORT_ID: "{{ reality_short_id | default('abcd1234') }}"
  register: compose_up
  retries: 2
  delay: 5
  until: compose_up.rc == 0

- name: Display compose up output
  debug:
    msg: "{{ compose_up.stdout_lines }}"

- name: Wait for bot container to be healthy
  command: docker compose ps bot --format "{{'{{.Health}}'}}"
  args:
    chdir: "{{ deploy_dir }}"
  register: bot_health
  retries: 30
  delay: 10
  until: bot_health.stdout is defined and 'healthy' in bot_health.stdout | lower
  changed_when: false
  ignore_errors: no

- name: DEBUG - Show bot health status
  debug:
    var: bot_health.stdout

- name: Fail if bot is not healthy
  fail:
    msg: "Bot container failed to become healthy. Check logs with: docker compose logs bot"
  when: bot_health is failed or not ('healthy' in bot_health.stdout | lower)

- name: Prune unused Docker images to free disk space
  command: docker image prune -f
  changed_when: true

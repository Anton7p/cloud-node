---
# Master Deployment Stack Entry Point
# This file orchestrates all master-specific deployment tasks
# ==========================================

- name: Include backup tasks
  include_tasks: "tasks/deploy-stack/common/backup.yml"

- name: Include configure tasks
  include_tasks: "tasks/deploy-stack/common/configure.yml"

- name: Include docker auth tasks
  include_tasks: "tasks/deploy-stack/common/docker-auth.yml"

- name: Include docker login tasks
  include_tasks: "tasks/deploy-stack/common/docker-login.yml"

- name: Include pull image tasks
  include_tasks: "tasks/deploy-stack/common/pull-image.yml"

- name: Include infrastructure boot tasks
  include_tasks: "tasks/deploy-stack/master/infrastructure.yml"

- name: Include VPN core boot tasks
  include_tasks: "tasks/deploy-stack/master/vpn-core.yml"

- name: Include reality keys setup tasks
  include_tasks: "tasks/deploy-stack/master/reality-keys.yml"

- name: Include health check tasks
  include_tasks: "tasks/deploy-stack/master/health-check.yml"

- name: Include nginx setup for subscription SSL
  include_tasks: "tasks/nginx/main.yml"
  when: domain_name is defined and domain_name | length > 0

# NOTE: Xray config fix removed - master only hosts panel, no Xray inbounds
# Xray on master is internal to Marzban Panel only

- name: Include cleanup tasks
  include_tasks: "tasks/deploy-stack/master/cleanup.yml"

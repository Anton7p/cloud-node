---
# Setup Reality Keys for Master Server
# This file generates X25519 keys and configures VLESS Reality inbound
# Should be called after Marzban container is running but before bot starts
# ============================================================================

- name: Compute Marzban API URL for master
  set_fact:
    master_api_url: "http://{{ inventory_hostname }}:8000/api"

- name: Wait for Marzban API to be available
  uri:
    url: "{{ master_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    return_content: yes
    status_code: [200, 401, 403]
    timeout: 10
  register: auth_check
  retries: 30
  delay: 5
  until: auth_check.status is defined and (auth_check.status == 200 or auth_check.status == 401 or auth_check.status == 403)
  no_log: true

- name: Create first admin if needed
  uri:
    url: "{{ master_api_url }}/admin"
    method: POST
    body_format: json
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
      is_sudo: true
    return_content: yes
    status_code: [200, 201, 403]
    timeout: 10
  when: auth_check.status == 401
  no_log: true

- name: Authenticate with Marzban API
  uri:
    url: "{{ master_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    return_content: yes
    status_code: 200
    timeout: 30
  register: auth_response
  no_log: true
  retries: 5
  delay: 3
  until: auth_response.status == 200

- name: Get current Xray core config
  uri:
    url: "{{ master_api_url }}/core/config"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: true
    status_code: [200]
    timeout: 30
  register: core_config

- name: Set fact - VLESS Reality inbound exists check
  set_fact:
    vless_reality_exists: >-
      {{ core_config.json is defined and
         core_config.json.inbounds is defined and
         core_config.json.inbounds | selectattr('tag', 'equalto', 'VLESS Reality TCP') | list | length > 0 }}

- name: Generate X25519 keys using xray
  command: docker run --rm {{ marzban_node_image }} xray x25519
  register: x25519_output
  when: not vless_reality_exists | bool
  changed_when: true
  check_mode: no

- name: DEBUG - Show X25519 output
  debug:
    msg:
      - "X25519 stdout_lines: {{ x25519_output.stdout_lines | default([]) }}"
      - "X25519 stdout: {{ x25519_output.stdout | default('N/A') }}"

- name: Parse generated keys
  set_fact:
    new_private_key: "{{ x25519_output.stdout | regex_search('Private key:\\s*([A-Za-z0-9_-]+)', '\\1') | first }}"
    new_public_key: "{{ x25519_output.stdout | regex_search('Public key:\\s*([A-Za-z0-9_-]+)', '\\1') | first }}"
  when: x25519_output.stdout is defined and not vless_reality_exists | bool

- name: Generate random SHORT_ID
  shell: openssl rand -hex 4
  register: openssl_short_id
  when: not vless_reality_exists | bool
  check_mode: no

- name: Set new_short_id fact
  set_fact:
    new_short_id: "{{ openssl_short_id.stdout | trim }}"
  when: openssl_short_id.stdout is defined and not vless_reality_exists | bool

- name: DEBUG - New keys status
  debug:
    msg:
      - "=== NEW KEYS ==="
      - "new_private_key: '{{ new_private_key | default('NOT_SET') }}'"
      - "new_public_key: '{{ new_public_key | default('NOT_SET') }}'"
      - "new_short_id: '{{ new_short_id | default('NOT_SET') }}'"

- name: Read existing keys from .env
  shell: |
    grep -E '^REALITY_(PRIVATE|PUBLIC)_KEY=|^REALITY_SHORT_ID=' {{ deploy_dir }}/.env 2>/dev/null | cut -d= -f2 | tr '\n' ' ' || echo ""
  register: existing_env_keys
  ignore_errors: true
  changed_when: false

- name: Set existing keys facts
  set_fact:
    existing_private_key: "{{ existing_env_keys.stdout.split(' ')[0] | default('') }}"
    existing_public_key: "{{ existing_env_keys.stdout.split(' ')[1] | default('') }}"
    existing_short_id: "{{ existing_env_keys.stdout.split(' ')[2] | default('') }}"
  when: vless_reality_exists | bool and existing_env_keys.stdout | length > 0

- name: DEBUG - Existing keys status
  debug:
    msg:
      - "=== EXISTING KEYS ==="
      - "existing_private_key: '{{ existing_private_key | default('NOT_SET') }}'"
      - "existing_public_key: '{{ existing_public_key | default('NOT_SET') }}'"
      - "existing_short_id: '{{ existing_short_id | default('NOT_SET') }}'"

- name: API RECOVERY - Fetch keys from Marzban if .env is empty but inbound exists
  block:
    - name: Get Xray core config from API
      uri:
        url: "{{ master_api_url }}/core/config"
        method: GET
        headers:
          Authorization: "Bearer {{ auth_response.json.access_token }}"
        status_code: 200
        timeout: 30
      register: api_config

    - name: Extract Reality keys from API config
      set_fact:
        api_private_key: "{{ (api_config.json.inbounds | selectattr('tag', 'equalto', 'VLESS Reality TCP') | first).streamSettings.realitySettings.privateKey | default('') }}"
        api_public_key: "{{ (api_config.json.inbounds | selectattr('tag', 'equalto', 'VLESS Reality TCP') | first).streamSettings.realitySettings.publicKey | default('') }}"
        api_short_id: "{{ ((api_config.json.inbounds | selectattr('tag', 'equalto', 'VLESS Reality TCP') | first).streamSettings.realitySettings.shortIds | first) | default('') }}"
      when: api_config.json is defined

    - name: Copy API keys to existing keys
      set_fact:
        existing_private_key: "{{ api_private_key }}"
        existing_public_key: "{{ api_public_key }}"
        existing_short_id: "{{ api_short_id }}"
      when: api_public_key | length > 0

    - name: Write API keys to .env
      lineinfile:
        path: "{{ deploy_dir }}/.env"
        regexp: "^{{ item.key }}="
        line: "{{ item.key }}={{ item.value }}"
        create: no
      loop:
        - { key: "REALITY_PRIVATE_KEY", value: "{{ api_private_key }}" }
        - { key: "REALITY_PUBLIC_KEY", value: "{{ api_public_key }}" }
        - { key: "REALITY_SHORT_ID", value: "{{ api_short_id }}" }
      when: api_public_key | length > 0

    - name: DEBUG - API recovery successful
      debug:
        msg:
          - "=== KEYS RECOVERED FROM API ==="
          - "api_public_key: '{{ api_public_key }}'"
          - "api_short_id: '{{ api_short_id }}'"
  when: 
    - vless_reality_exists | bool
    - (existing_public_key | default('')) | length == 0

- name: Select final keys (new or existing)
  set_fact:
    reality_private_key: "{{ new_private_key }}"
    reality_public_key: "{{ new_public_key }}"
    reality_short_id: "{{ new_short_id }}"

- name: DEBUG - Final keys selected
  debug:
    msg:
      - "=== FINAL KEYS SELECTED ==="
      - "reality_private_key: '{{ reality_private_key }}'"
      - "reality_public_key: '{{ reality_public_key }}'"
      - "reality_short_id: '{{ reality_short_id }}'"

- name: Create VLESS Reality inbound JSON
  copy:
    content: |
      {
        "tag": "VLESS Reality TCP",
        "listen": "0.0.0.0",
        "port": 443,
        "protocol": "vless",
        "settings": {
          "clients": [],
          "decryption": "none"
        },
        "streamSettings": {
          "network": "tcp",
          "security": "reality",
          "realitySettings": {
            "dest": "{{ domain_name }}:443",
            "serverNames": ["{{ domain_name }}"],
            "privateKey": "{{ reality_private_key }}",
            "publicKey": "{{ reality_public_key }}",
            "shortIds": ["{{ reality_short_id }}"]
          }
        },
        "sniffing": {
          "enabled": true,
          "destOverride": ["http", "tls"]
        }
      }
    dest: "/tmp/vless_reality_inbound.json"
  when: not vless_reality_exists | bool and reality_private_key | length > 0

- name: Build updated core config
  shell: |
    cat > /tmp/current_core_config.json << 'EOF'
    {{ core_config.json | to_nice_json }}
    EOF
    jq --slurpfile inbound /tmp/vless_reality_inbound.json '.inbounds = (.inbounds // []) + $inbound' /tmp/current_core_config.json
  register: updated_config_json
  when: not vless_reality_exists | bool and reality_private_key | length > 0

- name: Update Xray core config with VLESS Reality
  uri:
    url: "{{ master_api_url }}/core/config"
    method: PUT
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ updated_config_json.stdout }}"
    status_code: [200, 201, 204]
    timeout: 30
  when: not vless_reality_exists | bool and reality_private_key | length > 0 and updated_config_json.rc == 0

- name: DEBUG - Before updating .env file
  debug:
    msg:
      - "=== BEFORE .env UPDATE ==="
      - "reality_public_key: '{{ reality_public_key | default('NOT_SET') }}' (length: {{ reality_public_key | default('') | length }})"
      - "reality_short_id: '{{ reality_short_id | default('NOT_SET') }}' (length: {{ reality_short_id | default('') | length }})"
      - "Condition check: reality_public_key | length > 0 = {{ (reality_public_key | default('') | length > 0) }}"

- name: Update bot .env file with Reality keys
  lineinfile:
    path: "{{ deploy_dir }}/.env"
    regexp: "^{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: no
  loop:
    - { key: "REALITY_PUBLIC_KEY", value: "{{ reality_public_key | default('') }}" }
    - { key: "REALITY_SHORT_ID", value: "{{ reality_short_id | default('') }}" }
    - { key: "MARZBAN_INBOUND_TAG", value: "VLESS_REALITY" }
  when: (reality_public_key | default('')) | length > 0

- name: Display key generation status
  debug:
    msg: |
      Reality keys generated and saved:
      - Public Key: {{ reality_public_key | default('N/A') }}
      - Short ID: {{ reality_short_id | default('N/A') }}
      - Inbound created: {{ not vless_reality_exists | bool }}

# ============================================================================
# BOT STARTUP (after keys are in .env)
# ============================================================================

- name: Start Bot container with fresh env
  command: docker compose up -d bot --force-recreate
  args:
    chdir: "{{ deploy_dir }}"
  environment:
    DB_PASSWORD: "{{ db_password }}"
    TELEGRAM_BOT_TOKEN: "{{ telegram_bot_token }}"
    ENCRYPTION_KEY: "{{ encryption_key }}"
    DOCKER_IMAGE_NAME: "{{ image_name }}"
    REDIS_PASSWORD: "{{ redis_password | default('') }}"
    MARZBAN_URL: "http://marzban:8000"
    VPN_ADMIN_USERNAME: "{{ vpn_admin_username }}"
    VPN_ADMIN_PASSWORD: "{{ vpn_admin_password }}"
    INFRASTRUCTURE_IP_LIST: "{{ infrastructure_ip_list | default('') }}"
    DOMAIN_NAME: "{{ domain_name }}"
  when: (reality_public_key | default('')) | length > 0

- name: DEBUG - Bot startup condition
  debug:
    msg: "Bot will start: reality_public_key length = {{ reality_public_key | default('') | length }}"

- name: Wait for bot container to be healthy
  command: docker compose ps bot --format "{% raw %}{{.Health}}{% endraw %}"
  args:
    chdir: "{{ deploy_dir }}"
  register: bot_health
  retries: 30
  delay: 10
  until: bot_health.stdout is defined and 'healthy' in bot_health.stdout | lower
  changed_when: false

- name: DEBUG - Show bot health status
  debug:
    var: bot_health.stdout

- name: Fail if bot is not healthy
  fail:
    msg: "Bot container failed to become healthy. Check logs with: docker compose logs bot"
  when: bot_health is failed or not ('healthy' in bot_health.stdout | lower)

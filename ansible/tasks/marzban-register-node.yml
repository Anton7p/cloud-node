---
# Node Registration in Marzban Core API
# Waits for Inbound to be ready before registering node

- name: Wait for Inbound to be ready before node registration
  uri:
    url: "{{ computed_api_url }}/inbounds"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: inbounds_ready_check
  until: inbounds_ready_check.json is defined and inbounds_ready_check.json | type_debug == 'list' and (inbounds_ready_check.json | map(attribute='tag') | list | select('equalto', 'VLESS_REALITY') | list | length > 0)
  retries: 10
  delay: 3
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Get existing nodes from Core API
  uri:
    url: "{{ computed_api_url }}/nodes"
    method: GET
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    return_content: yes
    status_code: [200]
    timeout: 30
  register: existing_nodes
  delegate_to: localhost
  become: no
  run_once: yes
  ignore_errors: yes

- name: Find nodes with same address to clean up
  set_fact:
    nodes_to_cleanup: >-
      {{ existing_nodes.json | default([]) | selectattr('address', 'equalto', inventory_hostname) | list }}
  delegate_to: localhost
  become: no

- name: Delete existing nodes with same address (cleanup garbage entries)
  uri:
    url: "{{ computed_api_url }}/node/{{ item.id }}"
    method: DELETE
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
    status_code: [200, 204, 404]
    timeout: 30
  loop: "{{ nodes_to_cleanup }}"
  when: nodes_to_cleanup | length > 0
  delegate_to: localhost
  become: no
  ignore_errors: yes

- name: Check if current node already registered
  set_fact:
    node_already_registered: false
  delegate_to: localhost
  become: no

- name: Generate API prefix for node
  set_fact:
    node_api_prefix: "{{ inventory_hostname | hash('sha1') | regex_replace('^(.{8}).*$', '\\1') }}"
  delegate_to: localhost
  run_once: no

- name: DEBUG - Show node registration data
  debug:
    msg:
      - "Registering node: {{ inventory_hostname }}"
      - "API prefix: {{ node_api_prefix }}"
      - "Certificate defined: {{ new_certificate is defined or cert_response.json.certificate is defined }}"
  delegate_to: localhost
  run_once: no

- name: Generate random password for node connection
  set_fact:
    node_connection_password: "{{ lookup('password', '/dev/null chars=ascii_letters,digits length=16') }}"
  delegate_to: localhost
  run_once: no
  when: not node_already_registered | default(true)

- name: Register node in Core API
  uri:
    url: "{{ computed_api_url }}/node"
    method: POST
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "{{ inventory_hostname | replace('.', '-') }}"
      address: "{{ inventory_hostname }}"
      port: 62050
      api_prefix: "{{ node_api_prefix }}"
      certificate: "{{ new_certificate | default(cert_response.json.certificate | default('')) }}"
    status_code: [201, 200, 409]
    timeout: 30
  when: not node_already_registered | default(true)
  register: node_registration
  delegate_to: localhost
  become: no
  ignore_errors: yes
  no_log: true

- name: Display node registration status
  debug:
    msg: "Node {{ inventory_hostname }} registered or already exists. Status: {{ node_registration.status | default('skipped') }}"
  delegate_to: localhost
  become: no

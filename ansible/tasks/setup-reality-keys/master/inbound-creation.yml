---
# VLESS Reality Inbound Creation - Master-specific
# ==========================================

- name: Build updated core config
  set_fact:
    updated_config_json: "{{ core_config.json | combine({'inbounds': [new_inbound]}, recursive=true) }}"
  when: not vless_reality_exists | bool
  vars:
    new_inbound:
      tag: "VLESS TCP REALITY"
      listen: "0.0.0.0"
      port: 50443
      protocol: "vless"
      settings:
        clients: []
        decryption: "none"
      streamSettings:
        network: "tcp"
        tcpSettings: {}
        security: "reality"
        realitySettings:
          show: false
          dest: "google.com:443"
          xver: 0
          serverNames:
            - "google.com"
            - "www.google.com"
            - ""
          privateKey: "{{ ansible_facts.reality_private_key }}"
          SpiderX: "/example"
          shortIds:
            - "{{ ansible_facts.reality_short_id }}"
      sniffing:
        enabled: true
        destOverride:
          - "http"
          - "tls"
          - "quic"

- name: Update Xray core config with VLESS Reality
  uri:
    url: "{{ master_api_url }}/core/config"
    method: PUT
    headers:
      Authorization: "Bearer {{ auth_response.json.access_token }}"
      Content-Type: "application/json"
    body_format: json
    body: "{{ updated_config_json }}"
    status_code: [200, 201, 204]
    timeout: 30
  when: not vless_reality_exists | bool

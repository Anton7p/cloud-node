---
# Authentication with Marzban API - Master-specific
# ==========================================

- name: Compute Marzban API URL for master
  set_fact:
    master_api_url: "http://{{ inventory_hostname }}:8000/api"

- name: Wait for Marzban API to be available
  uri:
    url: "{{ master_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    return_content: yes
    status_code: [200, 401, 403]
    timeout: 10
  register: auth_check
  retries: 30
  delay: 5
  until: auth_check.status is defined and (auth_check.status == 200 or auth_check.status == 401 or auth_check.status == 403)
  no_log: true

- name: Create first admin if needed
  uri:
    url: "{{ master_api_url }}/admin"
    method: POST
    body_format: json
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
      is_sudo: true
    return_content: yes
    status_code: [200, 201, 403]
    timeout: 10
  when: auth_check.status == 401
  no_log: true

- name: Authenticate with Marzban API
  uri:
    url: "{{ master_api_url }}/admin/token"
    method: POST
    body_format: form-urlencoded
    body:
      username: "{{ vpn_admin_username }}"
      password: "{{ vpn_admin_password }}"
    return_content: yes
    status_code: 200
    timeout: 30
  register: auth_response
  no_log: true
  retries: 5
  delay: 3
  until: auth_response.status == 200

---
# Ansible Playbook: Bootstrap Phase
# Начальная подготовка: SSH-ключ по CI, Docker, UFW, флаг /var/lib/bootstrap/.bootstrapped
# ============================================

- name: Bootstrap Server - Initial Preparation
  hosts: all
  become: yes
  gather_facts: yes
  strategy: linear

  vars:
    ssh_public_key: "{{ ssh_public_key | default(lookup('env', 'SSH_PUBLIC_KEY') | default('', true), true) }}"
    infrastructure_ip_list: "{{ infrastructure_ip_list | default(lookup('env', 'INFRASTRUCTURE_IP_LIST') | default('[]', true), true) }}"

  pre_tasks:
    - name: Require non-empty ssh_public_key
      fail:
        msg: "Передайте ssh_public_key через -e или переменную окружения SSH_PUBLIC_KEY"
      when: ssh_public_key | default('') | length == 0

    # JSON массив [{"address":"…"}] парсится строго; legacy — CSV через запятую; пусто → 0.0.0.0/0 для UFW
    - name: Parse infrastructure_ips as JSON
      set_fact:
        infrastructure_ips: "{{ (infrastructure_ip_list | from_json) | map(attribute='address') | list }}"
      when:
        - infrastructure_ip_list is string
        - infrastructure_ip_list | trim | length > 0
        - infrastructure_ip_list | trim != '[]'
        - (infrastructure_ip_list | trim | first) == '['

    - name: Parse infrastructure_ips as comma-separated (legacy)
      set_fact:
        infrastructure_ips: "{{ infrastructure_ip_list.split(',') | map('trim') | select('truthy') | list }}"
      when:
        - infrastructure_ip_list is string
        - infrastructure_ip_list | trim | length > 0
        - infrastructure_ip_list | trim != '[]'
        - infrastructure_ips is not defined

    - name: Default infrastructure_ips when list empty or unset
      set_fact:
        infrastructure_ips: "{{ ['0.0.0.0/0'] }}"
      when: infrastructure_ips is not defined

  tasks:
    - name: Run bootstrap tasks
      include_tasks: tasks/bootstrap-main.yml

  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

    - name: restart docker
      systemd:
        name: docker
        state: restarted

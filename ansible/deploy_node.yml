---
- name: Deploy or Update Marzban Node on Infrastructure Servers
  hosts: nodes
  become: yes
  strategy: free
  vars:
    node_dir: /var/www/marzban_node
    node_var_dir: "{{ node_dir }}/var"
    cert_file: "{{ node_var_dir }}/ssl_client_cert.pem"
    service_port: 62050
    xray_api_port: 62051
    marzban_node_image: gozargah/marzban-node:latest
    compose_project_name: "marzban-node"
    # Credentials - supports both extra-vars (-e) and env variables
    marzban_username: "{{ VPN_ADMIN_USERNAME | default(lookup('env', 'VPN_ADMIN_USERNAME'), true) }}"
    marzban_password: "{{ VPN_ADMIN_PASSWORD | default(lookup('env', 'VPN_ADMIN_PASSWORD'), true) }}"
    domain_name: "{{ DOMAIN_NAME | default(lookup('env', 'DOMAIN_NAME'), true) }}"

  pre_tasks:
    - name: Compute Marzban API URL
      set_fact:
        computed_api_url: "{{ 'http://' ~ lookup('env', 'SERVER_IP') ~ ':8000/api' if lookup('env', 'SERVER_IP') | length > 0 else 'https://' ~ domain_name ~ '/api' }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: Display computed API URL
      debug:
        msg: "Using Marzban API URL: {{ computed_api_url }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: Validate required GitLab variables
      fail:
        msg: "Missing required GitLab CI/CD variable: {{ item.var }}. Please set it in GitLab Settings > CI/CD > Variables."
      when: item.value | length == 0
      loop:
        - { var: "VPN_ADMIN_USERNAME", value: "{{ marzban_username }}" }
        - { var: "VPN_ADMIN_PASSWORD", value: "{{ marzban_password }}" }
        - { var: "DOMAIN_NAME", value: "{{ domain_name }}" }
      loop_control:
        label: "{{ item.var }}"
      delegate_to: localhost
      become: no
      run_once: yes

  tasks:
    - name: Setup directory structure
      include_tasks: tasks/directory-setup.yml

    - name: Setup Docker and Docker Compose
      include_tasks: tasks/docker-setup.yml

    - name: Apply system optimizations
      include_tasks: tasks/system-optimization.yml

    - name: Handle authentication and certificate fetching
      include_tasks: tasks/auth-certificate.yml

    - name: Setup Marzban Core (inbounds and node registration)
      include_tasks: tasks/marzban-setup.yml

    - name: Deploy and manage Marzban Node container
      include_tasks: tasks/marzban-node.yml

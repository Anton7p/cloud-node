---
- name: Deploy or Update Marzban Node on Infrastructure Servers
  hosts: nodes
  become: yes
  strategy: free
  vars:
    node_dir: /var/www/marzban_node
    node_var_dir: "{{ node_dir }}/var"
    cert_file: "{{ node_var_dir }}/ssl_client_cert.pem"
    service_port: 62050
    xray_api_port: 62051
    marzban_node_image: gozargah/marzban-node:v0.5.2
    compose_project_name: "marzban-node"
    # Credentials - passed via extra-vars from GitHub Actions secrets
    marzban_username: "{{ vpn_admin_username | default(lookup('env', 'VPN_ADMIN_USERNAME'), true) }}"
    marzban_password: "{{ vpn_admin_password | default(lookup('env', 'VPN_ADMIN_PASSWORD'), true) }}"
    domain_name: "{{ domain_name_extra | default(lookup('env', 'DOMAIN_NAME'), true) }}"

  pre_tasks:
    - name: DEBUG - Start node deployment
      debug:
        msg:
          - "=== NODE DEPLOYMENT START ==="
          - "Target node: {{ inventory_hostname }}"
          - "Node directory: {{ node_dir }}"
          - "Service port: {{ service_port }}"
          - "Xray API port: {{ xray_api_port }}"
          - "Master server: {{ master_server_address | default('NOT SET') }}"
          - "Domain: {{ domain_name }}"

    - name: Wait for Master API to be available
      uri:
        url: "http://{{ master_server_address }}:8000/api/admin/token"
        method: POST
        body_format: json
        body:
          username: "{{ marzban_username }}"
          password: "{{ marzban_password }}"
        status_code: [200, 401, 403, 422]
      register: master_api_check
      retries: 30
      delay: 10
      until: master_api_check.status is defined and (master_api_check.status == 200 or master_api_check.status == 401 or master_api_check.status == 403 or master_api_check.status == 422)
      delegate_to: localhost
      become: no
      run_once: yes
      when: master_server_address | length > 0

    - name: DEBUG - Master API status
      debug:
        msg: "Master API is available (status: {{ master_api_check.status | default('N/A') }})"
      when: master_api_check is defined and master_api_check.status is defined

    - name: DEBUG - Check node prerequisites
      shell: |
        echo "Docker version: $(docker --version)"
        echo "Docker Compose: $(docker compose version)"
        echo "Disk space: $(df -h /var/www | tail -1)"
      register: node_prereq
      changed_when: false

    - name: DEBUG - Show prerequisites
      debug:
        var: node_prereq.stdout_lines

    - name: Get master server address
      set_fact:
        master_server_address: "{{ lookup('env', 'SERVER_IP_ADDRESS') | default(groups['master'][0] | default(''), true) }}"

    - name: Compute Marzban API URL
      set_fact:
        computed_api_url: "{{ 'http://' ~ master_server_address ~ ':8000/api' if master_server_address | length > 0 else 'https://' ~ domain_name ~ '/api' }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: Display computed API URL
      debug:
        msg: "Using Marzban API URL: {{ computed_api_url }}"
      delegate_to: localhost
      become: no
      run_once: yes

    - name: Validate required CI/CD variables
      fail:
        msg: "Missing required CI/CD variable: {{ item.var }}. Please set it in GitHub Settings > Secrets and variables."
      when: item.value | length == 0
      loop:
        - { var: "VPN_ADMIN_USERNAME", value: "{{ marzban_username }}" }
        - { var: "VPN_ADMIN_PASSWORD", value: "{{ marzban_password }}" }
        - { var: "DOMAIN_NAME", value: "{{ domain_name }}" }
      loop_control:
        label: "{{ item.var }}"
      delegate_to: localhost
      become: no
      run_once: yes

  tasks:
    - name: Setup directory structure
      include_tasks: tasks/directory-setup.yml

    - name: Setup Docker and Docker Compose
      include_tasks: tasks/docker-setup.yml

    - name: Apply system optimizations
      include_tasks: tasks/system-optimization.yml

    - name: Handle authentication and certificate fetching
      include_tasks: tasks/auth-certificate.yml

    - name: Setup Marzban Core and Node (consolidated)
      include_tasks: tasks/marzban.yml

  handlers:
    - name: restart sshd
      systemd:
        name: ssh
        state: restarted

    - name: restart docker
      systemd:
        name: docker
        state: restarted

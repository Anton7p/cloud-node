---
# Ansible Playbook: Application Deployment
# Description: Deploys CloudNode application stack to master server
# ==========================================

- name: Deploy CloudNode Application Stack
  hosts: master
  become: yes
  strategy: linear

  vars:
    deploy_dir: /var/www/cloudnode
    backup_dir: /var/backups/cloudnode
    registry_url: "ghcr.io"
    server_ip: "{{ lookup('env', 'SERVER_IP') | default(inventory_hostname, true) }}"
    server_user: "{{ lookup('env', 'SERVER_USER') | default('root', true) }}"
    image_name: "{{ lookup('env', 'IMAGE_NAME') }}"
    image_tag: "{{ lookup('env', 'IMAGE_TAG') }}"
    db_password: "{{ lookup('env', 'DB_PASSWORD') }}"
    telegram_bot_token: "{{ lookup('env', 'TELEGRAM_BOT_TOKEN') }}"
    encryption_key: "{{ lookup('env', 'ENCRYPTION_KEY') }}"
    redis_password: "{{ lookup('env', 'REDIS_PASSWORD') | default('', true) }}"
    vpn_admin_username: "{{ lookup('env', 'VPN_ADMIN_USERNAME') }}"
    vpn_admin_password: "{{ lookup('env', 'VPN_ADMIN_PASSWORD') }}"
    infrastructure_ip_list: "{{ lookup('env', 'INFRASTRUCTURE_IP_LIST') | default('', true) }}"
    domain_name: "{{ lookup('env', 'DOMAIN_NAME') }}"
    reality_public_key: "{{ lookup('env', 'REALITY_PUBLIC_KEY') | default('', true) }}"
    reality_short_id: "{{ lookup('env', 'REALITY_SHORT_ID') | default('abcd1234', true) }}"
    marzban_inbound_tag: "{{ lookup('env', 'MARZBAN_INBOUND_TAG') | default('VLESS_REALITY', true) }}"
    ghcr_username: "{{ lookup('env', 'GHCR_USERNAME') }}"
    ghcr_token: "{{ lookup('env', 'GHCR_TOKEN') }}"

  pre_tasks:
    - name: Generate Reality keys if not provided
      block:
        - name: Check if keys need generation
          set_fact:
            needs_key_generation: "{{ reality_public_key | length == 0 }}"

        - name: Generate X25519 keys using xray
          command: docker run --rm gozargah/marzban-node:latest xray x25519
          register: x25519_output
          when: needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes
          changed_when: true

        - name: Parse generated public key
          set_fact:
            reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
          when: x25519_output.stdout is defined and needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Parse generated private key
          set_fact:
            reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
          when: x25519_output.stdout is defined and needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Generate random SHORT_ID
          shell: openssl rand -hex 4
          register: openssl_short_id
          when: needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Set reality_short_id fact
          set_fact:
            reality_short_id: "{{ openssl_short_id.stdout }}"
          when: openssl_short_id.stdout is defined and needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Display generated keys
          debug:
            msg:
              - "Generated Public Key: {{ reality_public_key | default('N/A') }}"
              - "Generated Short ID: {{ reality_short_id | default('N/A') }}"
          when: needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes
      when: reality_public_key | length == 0

    - name: Display deployment information
      debug:
        msg: |
          ==========================================
          Deploying CloudNode Application
          Target: {{ inventory_hostname }}
          Image: {{ image_name | default('NOT SET') }}:{{ image_tag | default('NOT SET') }}
          Reality Key: {{ reality_public_key | default('NOT SET') }}
          ==========================================

    - name: Validate required variables
      fail:
        msg: "Missing required variable: {{ item }}"
      when: vars[item] is not defined or vars[item] | length == 0
      loop:
        - image_name
        - image_tag
        - db_password
        - telegram_bot_token
        - encryption_key
        - vpn_admin_username
        - vpn_admin_password
        - domain_name

  tasks:
    - name: Include backup tasks
      include_tasks: tasks/deploy/01-backup.yml

    - name: Include configuration tasks
      include_tasks: tasks/deploy/02-configure.yml

    - name: Include Docker auth tasks
      include_tasks: tasks/deploy/03-docker-auth.yml

    - name: Include image pull tasks
      include_tasks: tasks/deploy/04-pull-image.yml

    - name: Include stack deployment tasks
      include_tasks: tasks/deploy/05-stack-deploy.yml

    - name: Include health check tasks
      include_tasks: tasks/deploy/06-health-check.yml

    - name: Include cleanup tasks
      include_tasks: tasks/deploy/07-cleanup.yml

  handlers:
    - name: Restart bot container
      command: docker compose restart bot
      args:
        chdir: "{{ deploy_dir }}"

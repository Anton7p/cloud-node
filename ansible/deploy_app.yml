---
# Ansible Playbook: Application Deployment
# Description: Deploys CloudNode application stack to master server
# ==========================================

- name: Deploy CloudNode Application Stack
  hosts: master
  become: yes
  strategy: linear

  vars:
    deploy_dir: /var/www/cloudnode
    backup_dir: /var/backups/cloudnode
    registry_url: "ghcr.io"
    server_ip: "{{ inventory_hostname }}"
    server_user: "root"
    # Variables passed via --extra-vars (-e) from CI/CD or deploy.sh:
    # Extra-vars have highest precedence and override these defaults
    image_name: "{{ image_name | default('') }}"
    image_tag: "{{ image_tag | default('') }}"
    db_password: "{{ db_password | default('') }}"
    telegram_bot_token: "{{ telegram_bot_token | default('') }}"
    encryption_key: "{{ encryption_key | default('') }}"
    vpn_admin_username: "{{ vpn_admin_username | default('') }}"
    vpn_admin_password: "{{ vpn_admin_password | default('') }}"
    domain_name: "{{ domain_name | default('') }}"
    infrastructure_ip_list: "{{ infrastructure_ip_list | default('') }}"
    ghcr_username: "{{ ghcr_username | default('') }}"
    ghcr_token: "{{ ghcr_token | default('') }}"
    redis_password: "{{ redis_password | default(vpn_admin_password) }}"
    marzban_inbound_tag: "{{ marzban_inbound_tag | default('VLESS_REALITY') }}"
    reality_public_key: "{{ reality_public_key | default('') }}"
    reality_short_id: "{{ reality_short_id | default('') }}"

  pre_tasks:
    - name: DEBUG - Log deployment start
      debug:
        msg:
          - "=== DEPLOYMENT START ==="
          - "Target: {{ inventory_hostname }}"
          - "Deploy dir: {{ deploy_dir }}"
          - "Image: {{ image_name }}"
          - "Domain: {{ domain_name }}"
          - "Infrastructure IPs: {{ infrastructure_ip_list }}"
          - "VPN Admin defined: {{ vpn_admin_username | length > 0 }}"
          - "Reality Public Key defined: {{ reality_public_key | length > 0 }}"

    - name: DEBUG - Check Docker status
      shell: docker version && docker info 2>&1 | head -20
      register: docker_check
      changed_when: false

    - name: DEBUG - Show Docker status
      debug:
        var: docker_check.stdout

    - name: DEBUG - Check disk space
      shell: df -h {{ deploy_dir }} 2>/dev/null || df -h /
      register: disk_space
      changed_when: false

    - name: DEBUG - Show disk space
      debug:
        var: disk_space.stdout

    - name: Generate Reality keys if not provided
      block:
        - name: Check if keys need generation
          set_fact:
            needs_key_generation: "{{ reality_public_key | length == 0 }}"

        - name: Generate X25519 keys using xray
          command: docker run --rm gozargah/marzban-node:latest xray x25519
          register: x25519_output
          when: needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes
          changed_when: true

        - name: Parse generated public key
          set_fact:
            reality_public_key: "{{ x25519_output.stdout | regex_search('Public key: ([^\\s]+)', '\\1') | first }}"
          when: x25519_output.stdout is defined and needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Parse generated private key
          set_fact:
            reality_private_key: "{{ x25519_output.stdout | regex_search('Private key: ([^\\s]+)', '\\1') | first }}"
          when: x25519_output.stdout is defined and needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Display generated keys
          debug:
            msg:
              - "Generated Public Key: {{ reality_public_key | default('N/A') }}"
          when: needs_key_generation | bool
          delegate_to: localhost
          become: no
          run_once: yes
      when: reality_public_key | length == 0

    - name: Generate Reality Short ID if not provided
      block:
        - name: Generate random SHORT_ID (8 hex chars)
          shell: openssl rand -hex 4
          register: openssl_short_id
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Set reality_short_id fact
          set_fact:
            reality_short_id: "{{ openssl_short_id.stdout }}"
          when: openssl_short_id.stdout is defined
          delegate_to: localhost
          become: no
          run_once: yes

        - name: Display generated Short ID
          debug:
            msg: "Generated Short ID: {{ reality_short_id }}"
          delegate_to: localhost
          become: no
          run_once: yes
      when: reality_short_id | length == 0

    - name: Display deployment information
      debug:
        msg: |
          ==========================================
          Deploying CloudNode Application
          Target: {{ inventory_hostname }}
          Image: {{ image_name | default('NOT SET') }}:{{ image_tag | default('NOT SET') }}
          Reality Key: {{ reality_public_key | default('NOT SET') }}
          ==========================================

    - name: Validate required variables
      fail:
        msg: "Missing required variable: image_name or image_tag"
      when: image_name | length == 0 or image_tag | length == 0

    - name: Validate required variables (db_password)
      fail:
        msg: "Missing required variable: db_password (or vpn_admin_password as fallback)"
      when: db_password | length == 0

    - name: Validate required variables (telegram_bot_token)
      fail:
        msg: "Missing required variable: telegram_bot_token"
      when: telegram_bot_token | length == 0

    - name: Validate required variables (encryption_key)
      fail:
        msg: "Missing required variable: encryption_key"
      when: encryption_key | length == 0

    - name: Validate required variables (vpn_admin)
      fail:
        msg: "Missing required variable: vpn_admin_username or vpn_admin_password"
      when: vpn_admin_username | length == 0 or vpn_admin_password | length == 0

    - name: Validate required variables (domain_name)
      fail:
        msg: "Missing required variable: domain_name"
      when: domain_name | length == 0

  tasks:
    - name: Setup Docker and Docker Compose
      include_tasks: tasks/docker-setup.yml

    - name: Deploy application stack
      include_tasks: tasks/deploy-stack.yml

  handlers:
    - name: restart docker
      systemd:
        name: docker
        state: restarted

    - name: Restart bot container
      command: docker compose restart bot
      args:
        chdir: "{{ deploy_dir }}"

---
# Directory structure setup tasks
- name: Create node directory structure
  file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  loop:
    - "{{ node_dir }}"
    - "{{ node_var_dir }}"

- name: Fix permissions for certificate directory (container needs write access)
  file:
    path: "{{ node_var_dir }}"
    state: directory
    mode: '0777'
    recurse: yes

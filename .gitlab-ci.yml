stages:
  - build
  - deploy
  - infrastructure

variables:
  DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE
  DOCKER_IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  ANSIBLE_HOST_KEY_CHECKING: "False"

# Infrastructure stage - Deploy and configure remote nodes via Ansible
infrastructure:
  stage: infrastructure
  image: alpine/ansible:latest
  before_script:
    - apk add --no-cache openssh-client
    - |
      if [ -z "$SERVER_IP" ]; then
        echo "ERROR: SERVER_IP is not set. Please set it in GitLab Settings > CI/CD > Variables"
        exit 1
      fi
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "Configuring infrastructure nodes via Ansible..."
    - cd ansible
    - |
      # Generate inventory from SERVER_IP and INFRASTRUCTURE_IP_LIST
      echo "[master]" > inventory.ini
      echo "${SERVER_IP} ansible_user=${SERVER_USER:-root} ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini
      echo "" >> inventory.ini
      if [ -n "$INFRASTRUCTURE_IP_LIST" ]; then
        echo "[nodes]" >> inventory.ini
        IFS=',' read -ra IPS <<< "$INFRASTRUCTURE_IP_LIST"
        for ip in "${IPS[@]}"; do
          echo "${ip} ansible_user=${SERVER_USER:-root} ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory.ini
        done
        echo "" >> inventory.ini
        echo "[nodes:vars]" >> inventory.ini
        echo "ansible_python_interpreter=/usr/bin/python3" >> inventory.ini
        echo "domain_name=${DOMAIN_NAME}" >> inventory.ini
      fi
    - |
      ansible-playbook -i inventory.ini deploy_node.yml -f 10 \
        --extra-vars "domain_name=${DOMAIN_NAME}" \
        -e "VPN_ADMIN_USERNAME=${VPN_ADMIN_USERNAME}" \
        -e "VPN_ADMIN_PASSWORD=${VPN_ADMIN_PASSWORD}" \
        -e "SERVER_IP=${SERVER_IP}"
    - echo "Infrastructure configuration completed!"
  only:
    - main
    - master
    - develop

# Build stage - Build Docker image
build:
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin $CI_REGISTRY
  script:
    - echo "Building Docker image..."
    - docker build
      --build-arg NODE_ENV=production
      -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
      -t $DOCKER_IMAGE_LATEST
      .
    - echo "Pushing Docker image to registry..."
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - docker push $DOCKER_IMAGE_LATEST
    - echo "Build completed successfully!"
  only:
    - main
    - master
    - develop

# Deploy stage - Deploy to server via SSH
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client rsync
    - |
      if [ -z "$SERVER_IP" ]; then
        echo "ERROR: SERVER_IP is not set. Please set it in GitLab Settings > CI/CD > Variables"
        exit 1
      fi
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
  script:
    - echo "Deploying to server $SERVER_IP..."
    - rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no" docker-compose.yml ${SERVER_USER:-root}@${SERVER_IP}:/var/www/cloudnode/
    - |
      export REMOTE_CI_REGISTRY_USER="$CI_REGISTRY_USER"
      export REMOTE_CI_REGISTRY_PASSWORD="$CI_REGISTRY_PASSWORD"
      export REMOTE_CI_REGISTRY="$CI_REGISTRY"
      export REMOTE_DOCKER_IMAGE_NAME="$DOCKER_IMAGE_NAME"
      export REMOTE_DB_PASSWORD="$DB_PASSWORD"
      export REMOTE_TELEGRAM_BOT_TOKEN="$TELEGRAM_BOT_TOKEN"
      export REMOTE_ENCRYPTION_KEY="$ENCRYPTION_KEY"
      export REMOTE_REDIS_HOST="$REDIS_HOST"
      export REMOTE_REDIS_PORT="${REDIS_PORT:-6379}"
      export REMOTE_REDIS_PASSWORD="$REDIS_PASSWORD"
      export REMOTE_VPN_ADMIN_USERNAME="$VPN_ADMIN_USERNAME"
      export REMOTE_VPN_ADMIN_PASSWORD="$VPN_ADMIN_PASSWORD"
      export REMOTE_MARZBAN_URL="http://marzban:8000"
      export REMOTE_SUB_BASE_URL="$SUB_BASE_URL"
      export REMOTE_INFRASTRUCTURE_IP_LIST="$INFRASTRUCTURE_IP_LIST"
      export REMOTE_DOMAIN_NAME="$DOMAIN_NAME"
      export REMOTE_MARZBAN_NODE_CERT_DIR="/var/www/marzban_node/var"
      ssh -o StrictHostKeyChecking=no ${SERVER_USER:-root}@${SERVER_IP} << EOF
        set -e

        echo "[DEPLOY] Connecting to server..."
        cd /var/www/cloudnode || mkdir -p /var/www/cloudnode && cd /var/www/cloudnode

        echo "[DEPLOY] Creating .env file..."
        echo "NODE_ENV=production" > .env
        echo "DATABASE_URL=postgresql://postgres:${REMOTE_DB_PASSWORD}@db:5432/cloudnode?schema=public" >> .env
        echo "DB_PASSWORD=${REMOTE_DB_PASSWORD}" >> .env
        echo "TELEGRAM_BOT_TOKEN=${REMOTE_TELEGRAM_BOT_TOKEN}" >> .env
        echo "ENCRYPTION_KEY=${REMOTE_ENCRYPTION_KEY}" >> .env
        echo "DOCKER_IMAGE_NAME=${REMOTE_DOCKER_IMAGE_NAME}" >> .env
        echo "REDIS_HOST=${REMOTE_REDIS_HOST}" >> .env
        echo "REDIS_PORT=${REMOTE_REDIS_PORT}" >> .env
        echo "REDIS_PASSWORD=${REMOTE_REDIS_PASSWORD}" >> .env
        echo "MARZBAN_URL=${REMOTE_MARZBAN_URL}" >> .env
        echo "VPN_ADMIN_USERNAME=${REMOTE_VPN_ADMIN_USERNAME}" >> .env
        echo "VPN_ADMIN_PASSWORD=${REMOTE_VPN_ADMIN_PASSWORD}" >> .env
        echo "SUB_BASE_URL=${REMOTE_SUB_BASE_URL}" >> .env
        echo "INFRASTRUCTURE_IP_LIST=${REMOTE_INFRASTRUCTURE_IP_LIST}" >> .env
        echo "DOMAIN_NAME=${REMOTE_DOMAIN_NAME}" >> .env
        echo "MARZBAN_NODE_CERT_DIR=${REMOTE_MARZBAN_NODE_CERT_DIR}" >> .env

        echo "[DEPLOY] Logging into Docker Registry..."
        echo "${REMOTE_CI_REGISTRY_PASSWORD}" | docker login -u "${REMOTE_CI_REGISTRY_USER}" --password-stdin ${REMOTE_CI_REGISTRY}

        echo "[DEPLOY] Pulling latest Docker image..."
        docker pull ${REMOTE_DOCKER_IMAGE_NAME}:latest

        echo "[DEPLOY] Stopping existing containers..."
        docker compose down || true

        echo "[DEPLOY] Starting new containers..."
        export DB_PASSWORD=${REMOTE_DB_PASSWORD}
        export TELEGRAM_BOT_TOKEN=${REMOTE_TELEGRAM_BOT_TOKEN}
        export ENCRYPTION_KEY=${REMOTE_ENCRYPTION_KEY}
        export DOCKER_IMAGE_NAME=${REMOTE_DOCKER_IMAGE_NAME}
        export REDIS_HOST=${REMOTE_REDIS_HOST}
        export REDIS_PORT=${REMOTE_REDIS_PORT}
        export REDIS_PASSWORD=${REMOTE_REDIS_PASSWORD}
        export MARZBAN_URL=${REMOTE_MARZBAN_URL}
        export VPN_ADMIN_USERNAME=${REMOTE_VPN_ADMIN_USERNAME}
        export VPN_ADMIN_PASSWORD=${REMOTE_VPN_ADMIN_PASSWORD}
        export SUB_BASE_URL=${REMOTE_SUB_BASE_URL}
        export INFRASTRUCTURE_IP_LIST=${REMOTE_INFRASTRUCTURE_IP_LIST}
        export DOMAIN_NAME=${REMOTE_DOMAIN_NAME}

        docker compose up -d

        echo "[DEPLOY] Containers started. Migrations run automatically on bot start."
        echo "[DEPLOY] Waiting for bot to initialize..."
        sleep 5

        echo "[DEPLOY] Cleaning up old images..."
        docker image prune -f

        echo "[DEPLOY] Deployment completed successfully!"
      EOF
    - echo "Deployment finished!"
  only:
    - main
    - master
  environment:
    name: production
    url: http://$SERVER_IP

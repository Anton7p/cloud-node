services:
  # Bot service - NestJS Telegram Bot application
  bot:
    image: ${DOCKER_IMAGE_NAME:-$CI_REGISTRY_IMAGE}:latest
    container_name: cloudnode-bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/cloudnode?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MARZBAN_URL: ${MARZBAN_URL}
      MARZBAN_ADMIN_USERNAME: ${MARZBAN_ADMIN_USERNAME}
      MARZBAN_ADMIN_PASSWORD: ${MARZBAN_ADMIN_PASSWORD}
      INFRASTRUCTURE_IP_LIST: ${INFRASTRUCTURE_IP_LIST}
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - cloudnode-network
    # Ports only if bot exposes HTTP endpoints
    # ports:
    #   - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database service - PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cloudnode-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=cloudnode
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudnode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis service - for BullMQ queues (password protected)
  redis:
    image: redis:alpine
    container_name: cloudnode-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Marzban Core - VPN Panel with SSL
  marzban:
    image: gozargah/marzban:latest
    container_name: cloudnode-marzban
    restart: always
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - UVICORN_SSL_CERTFILE=/var/lib/marzban/certs/cloudnode-host.ru.crt
      - UVICORN_SSL_KEYFILE=/var/lib/marzban/certs/cloudnode-host.ru.key
      - DASHBOARD_PATH=/dashboard
      - XRAY_SUBSCRIPTION_URL=https://cloudnode-host.ru
      - XRAY_EXECUTABLE_PATH=/usr/local/bin/xray
      - SSL_CERT_FILE=/var/lib/marzban/certs/cloudnode-host.ru.crt
      - SSL_KEY_FILE=/var/lib/marzban/certs/cloudnode-host.ru.key
      - SSL_CLIENT_CERT_FILE=/var/lib/marzban/certs/cloudnode-host.ru.crt
    volumes:
      - marzban-data:/var/lib/marzban
      - marzban-certs:/var/lib/marzban/certs
    networks:
      - cloudnode-network
    ports:
      - "443:443"
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  marzban-data:
    driver: local
  marzban-certs:
    driver: local

networks:
  cloudnode-network:
    driver: bridge

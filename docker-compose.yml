services:
  # Bot service - NestJS Telegram Bot application
  bot:
    image: ${DOCKER_IMAGE_NAME}
    container_name: cloudnode-bot
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@db:5432/cloudnode?schema=public
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MARZBAN_URL: http://marzban:8000
      VPN_ADMIN_USERNAME: ${VPN_ADMIN_USERNAME}
      VPN_ADMIN_PASSWORD: ${VPN_ADMIN_PASSWORD}
      INFRASTRUCTURE_IP_LIST: ${INFRASTRUCTURE_IP_LIST}
      DOMAIN_NAME: ${DOMAIN_NAME}
      MARZBAN_NODE_CERT_DIR: /var/www/marzban_node/var
    env_file:
      - .env
    command: sh -c "npx prisma migrate deploy && node dist/main.js"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      marzban:
        condition: service_healthy
    networks:
      - cloudnode-network
    volumes:
      - marzban-node-certs:/var/www/marzban_node/var:rw
    # Ports only if bot exposes HTTP endpoints
    # ports:
    #   - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database service - PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cloudnode-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=cloudnode
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudnode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis service - for BullMQ queues (password protected)
  redis:
    image: redis:alpine
    container_name: cloudnode-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${VPN_ADMIN_PASSWORD:-redis123}
    volumes:
      - redis-data:/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${VPN_ADMIN_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Marzban Core - VPN Panel (HTTP mode)
  marzban:
    image: gozargah/marzban:stable
    container_name: cloudnode-marzban
    restart: always
    command: bash -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - UVICORN_HOST=0.0.0.0
      - UVICORN_PORT=8000
      - DASHBOARD_PATH=/dashboard
      - XRAY_EXECUTABLE_PATH=/usr/local/bin/xray
      - SUDO_USERNAME=${VPN_ADMIN_USERNAME:-admin}
      - SUDO_PASSWORD=${VPN_ADMIN_PASSWORD:-admin123}
      - SUB_UPSTREAM_PATH=/sub
      - SUB_SUPPORT_HTTP=true
    volumes:
      - marzban-data:/var/lib/marzban
    networks:
      - cloudnode-network
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1s bash -c '</dev/tcp/127.0.0.1/8000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  marzban-data:
    driver: local
  marzban-node-certs:
    driver: local

networks:
  cloudnode-network:
    driver: bridge

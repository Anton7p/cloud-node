version: '3.8'

services:
  # Bot service - NestJS Telegram Bot application
  bot:
    image: ${DOCKER_IMAGE_NAME:-$CI_REGISTRY_IMAGE}:latest
    container_name: cloudnode-bot
    restart: always
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:${DB_PASSWORD}@db:5432/cloudnode?schema=public
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - cloudnode-network
    # Ports only if bot exposes HTTP endpoints
    # ports:
    #   - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Database service - PostgreSQL 16
  db:
    image: postgres:16-alpine
    container_name: cloudnode-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=cloudnode
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - cloudnode-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cloudnode"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres-data:
    driver: local

networks:
  cloudnode-network:
    driver: bridge

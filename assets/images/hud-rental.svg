<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#006699"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0a0a0f"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Server Rack -->
  <g transform="translate(140, 120)" fill="none" stroke="#00d4ff" stroke-width="2" filter="url(#glow)">
    <rect x="0" y="0" width="120" height="160" rx="5"/>
    <line x1="0" y1="40" x2="120" y2="40"/>
    <line x1="0" y1="80" x2="120" y2="80"/>
    <line x1="0" y1="120" x2="120" y2="120"/>
    <circle cx="20" cy="20" r="5" fill="#00d4ff"/>
    <circle cx="20" cy="60" r="5" fill="#00d4ff" opacity="0.7"/>
    <circle cx="20" cy="100" r="5" fill="#00d4ff" opacity="0.5"/>
    <circle cx="20" cy="140" r="5" fill="#00d4ff"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="20" fill="#00d4ff">RENTAL MODULE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#006699"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0a0a0f"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="200" cy="200" r="120" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
  <!-- User Icon -->
  <g transform="translate(200, 180)" fill="none" stroke="#00d4ff" stroke-width="3" filter="url(#glow)">
    <circle cx="0" cy="-30" r="35"/>
    <path d="M -60 80 Q 0 20 60 80" stroke-linecap="round"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="20" fill="#00d4ff">IDENTITY MODULE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0099cc;stop-opacity:0.4" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGrad)"/>

  <!-- Grid Lines -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.3">
    <line x1="0" y1="50" x2="800" y2="50"/>
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="350" x2="800" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="700" y1="0" x2="700" y2="400"/>
  </g>

  <!-- Globe/Circle -->
  <circle cx="400" cy="200" r="120" fill="none" stroke="url(#blueGrad)" stroke-width="2" filter="url(#glow)"/>
  <circle cx="400" cy="200" r="100" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>

  <!-- Connection/Network Icon -->
  <g transform="translate(400, 200)" filter="url(#glow)">
    <!-- Central Node -->
    <circle cx="0" cy="0" r="15" fill="none" stroke="#00d4ff" stroke-width="3"/>
    <circle cx="0" cy="0" r="5" fill="#00d4ff"/>
    
    <!-- Connected Nodes -->
    <circle cx="-40" cy="-30" r="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="40" cy="-30" r="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="-40" cy="30" r="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    <circle cx="40" cy="30" r="8" fill="none" stroke="#00d4ff" stroke-width="2"/>
    
    <!-- Connection Lines -->
    <line x1="0" y1="0" x2="-40" y2="-30" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="-30" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="0" x2="-40" y2="30" stroke="#00d4ff" stroke-width="2"/>
    <line x1="0" y1="0" x2="40" y2="30" stroke="#00d4ff" stroke-width="2"/>
  </g>

  <!-- Connection Lines -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.4">
    <line x1="280" y1="200" x2="100" y2="100"/>
    <line x1="520" y1="200" x2="700" y2="100"/>
    <line x1="280" y1="200" x2="100" y2="300"/>
    <line x1="520" y1="200" x2="700" y2="300"/>
  </g>

  <!-- Corner Decorations -->
  <g stroke="#00d4ff" stroke-width="2" fill="none">
    <path d="M 20,20 L 50,20 L 50,50"/>
    <path d="M 780,20 L 750,20 L 750,50"/>
    <path d="M 20,380 L 50,380 L 50,350"/>
    <path d="M 780,380 L 750,380 L 750,350"/>
  </g>

  <!-- Text -->
  <text x="400" y="360" text-anchor="middle" fill="#00d4ff" font-family="monospace" font-size="18" filter="url(#glow)">SETUP GUIDE</text>
</svg>

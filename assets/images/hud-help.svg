<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#006699"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#0a0a0f"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="url(#cyberGrad)" stroke-width="2" filter="url(#glow)"/>
  <!-- Help Icon -->
  <g transform="translate(200, 200)" fill="none" stroke="#00d4ff" stroke-width="4" filter="url(#glow)" stroke-linecap="round">
    <circle cx="0" cy="0" r="60"/>
    <path d="M -15 -10 Q -15 -30 0 -30 Q 15 -30 15 -15 Q 15 0 0 5 L 0 25"/>
    <circle cx="0" cy="45" r="5" fill="#00d4ff"/>
  </g>
  <text x="200" y="360" text-anchor="middle" font-family="monospace" font-size="20" fill="#00d4ff">SUPPORT MODULE</text>
</svg>

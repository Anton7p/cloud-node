---
# Reusable Workflow: Application Deployment
# ==========================================

name: Deploy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:
    inputs:
      image_tag:
        description: "Docker image tag to deploy"
        required: true
        type: string
      image_name:
        description: "Full Docker image name"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://production-server
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP_JSON: ${{ secrets.SERVER_IP }}
      IMAGE_NAME: ${{ inputs.image_name }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      DB_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      REDIS_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
      REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
      MARZBAN_INBOUND_TAG: ${{ secrets.MARZBAN_INBOUND_TAG || 'VLESS_REALITY' }}
      GHCR_USERNAME: ${{ github.actor }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Show image to deploy
        run: |
          echo "=== IMAGE TO DEPLOY ==="
          echo "Image: ${{ inputs.image_name }}"
          echo "Tag: ${{ inputs.image_tag }}"
          echo "Full: ${{ inputs.image_name }}:${{ inputs.image_tag }}"

      - name: Install dependencies
        run: pip install ansible jq

      - name: Parse server configuration
        id: parse_config
        run: |
          echo "=== Parsing Server Configuration ==="

          # Parse master server JSON
          SERVER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address // empty')
          echo "server_address=$SERVER_ADDRESS" >> $GITHUB_OUTPUT
          echo "Master Server: $SERVER_ADDRESS"

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SERVER_ADDRESS="${{ steps.parse_config.outputs.server_address }}"
          ssh-keyscan -H "$SERVER_ADDRESS" >> ~/.ssh/known_hosts

      - name: Generate deployment inventory
        working-directory: ./ansible
        run: |
          SERVER_ADDRESS="${{ steps.parse_config.outputs.server_address }}"

          echo "[master]" > inventory_deploy.ini
          echo "$SERVER_ADDRESS ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_deploy.ini
          echo "=== Deploy Inventory ==="
          cat inventory_deploy.ini

      - name: Deploy application via Ansible
        working-directory: ./ansible
        run: ansible-playbook -i inventory_deploy.ini deploy_app.yml

      - name: Verify deployment
        run: |
          sleep 10
          SERVER_ADDRESS="${{ steps.parse_config.outputs.server_address }}"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@$SERVER_ADDRESS \
            "docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E '(cloudnode|marzban)'" || true

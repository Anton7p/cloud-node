name: Reusable - Configure Infrastructure

on:
  workflow_call:
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SERVER_IP:
        required: true
      SERVER_USER:
        required: false
      INFRASTRUCTURE_IP_LIST:
        required: false
      DOMAIN_NAME:
        required: true
      VPN_ADMIN_USERNAME:
        required: true
      VPN_ADMIN_PASSWORD:
        required: true
      REALITY_PRIVATE_KEY:
        required: false
      REALITY_PUBLIC_KEY:
        required: false
      REALITY_SHORT_ID:
        required: false

jobs:
  infrastructure:
    name: Configure Infrastructure Nodes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH keys
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts 2>/dev/null || true
          if [ -n "$INFRASTRUCTURE_IP_LIST" ]; then
            IFS=',' read -ra IPS <<< "$INFRASTRUCTURE_IP_LIST"
            for ip in "${IPS[@]}"; do
              ssh-keyscan -H "$ip" >> ~/.ssh/known_hosts 2>/dev/null || true
            done
          fi

      - name: Install Ansible
        run: pip install ansible requests urllib3

      - name: Generate dynamic inventory
        working-directory: ./ansible
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          cat > inventory_dynamic.ini << EOF
[master]
$SERVER_IP ansible_user=$SERVER_USER ansible_ssh_private_key_file=~/.ssh/id_rsa

[nodes]
EOF
          if [ -n "$INFRASTRUCTURE_IP_LIST" ]; then
            IFS=',' read -ra IPS <<< "$INFRASTRUCTURE_IP_LIST"
            for ip in "${IPS[@]}"; do
              echo "$ip ansible_user=$SERVER_USER ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_dynamic.ini
            done
          fi
          cat >> inventory_dynamic.ini << EOF

[nodes:vars]
ansible_python_interpreter=/usr/bin/python3
domain_name=$DOMAIN_NAME
EOF
          echo "=== Generated Inventory ==="
          cat inventory_dynamic.ini

      - name: Run Ansible playbook for infrastructure
        working-directory: ./ansible
        env:
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          REALITY_PRIVATE_KEY: ${{ secrets.REALITY_PRIVATE_KEY }}
          REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
        run: |
          ansible-playbook -i inventory_dynamic.ini deploy_node.yml -f 10

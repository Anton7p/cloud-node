---
# Reusable Workflow: Infrastructure Setup
# ==========================================
# SERVER_IP format: {"address": "1.2.3.4", "password": "secret"}
# INFRASTRUCTURE_IP_LIST format: [{"address": "1.2.3.5", "password": "secret"}]

name: Infrastructure

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  workflow_call:

jobs:
  infrastructure:
    name: Configure Infrastructure Nodes
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
      SERVER_IP_JSON: ${{ secrets.SERVER_IP }}
      INFRASTRUCTURE_IP_LIST_JSON: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      REALITY_PRIVATE_KEY: ${{ secrets.REALITY_PRIVATE_KEY }}
      REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
      REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install ansible requests urllib3 jq

      - name: Parse server configurations
        id: parse_config
        run: |
          echo "=== Parsing Server Configurations ==="

          # Parse master server JSON
          SERVER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address // empty')
          echo "server_address=$SERVER_ADDRESS" >> $GITHUB_OUTPUT
          echo "Master Server: $SERVER_ADDRESS"

          # Parse infrastructure nodes JSON array
          NODES_COUNT=$(echo "$INFRASTRUCTURE_IP_LIST_JSON" | jq 'length')
          echo "Infrastructure nodes count: $NODES_COUNT"

      - name: Setup SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SERVER_ADDRESS="${{ steps.parse_config.outputs.server_address }}"
          ssh-keyscan -H "$SERVER_ADDRESS" >> ~/.ssh/known_hosts 2>/dev/null || true

          # Scan node addresses from JSON
          echo "$INFRASTRUCTURE_IP_LIST_JSON" | jq -r '.[].address // empty' | while read node_addr; do
            if [ -n "$node_addr" ]; then
              ssh-keyscan -H "$node_addr" >> ~/.ssh/known_hosts 2>/dev/null || true
            fi
          done

      - name: Generate dynamic inventory
        working-directory: ./ansible
        run: |
          SERVER_ADDRESS="${{ steps.parse_config.outputs.server_address }}"

          echo "[master]" > inventory_dynamic.ini
          echo "$SERVER_ADDRESS ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_dynamic.ini
          echo "" >> inventory_dynamic.ini

          echo "[nodes]" >> inventory_dynamic.ini
          echo "$INFRASTRUCTURE_IP_LIST_JSON" | jq -r '.[].address // empty' | while read node_addr; do
            if [ -n "$node_addr" ]; then
              echo "$node_addr ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_dynamic.ini
            fi
          done

          echo "" >> inventory_dynamic.ini
          echo "[nodes:vars]" >> inventory_dynamic.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory_dynamic.ini
          echo "domain_name=$DOMAIN_NAME" >> inventory_dynamic.ini
          echo "=== Generated Inventory ==="
          cat inventory_dynamic.ini

      - name: Run Ansible playbook for infrastructure
        working-directory: ./ansible
        env:
          SERVER_IP_ADDRESS: ${{ steps.parse_config.outputs.server_address }}
        run: ansible-playbook -i inventory_dynamic.ini deploy_node.yml -f 10

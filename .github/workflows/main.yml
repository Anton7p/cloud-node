# ==========================================
# CloudNode CI/CD Pipeline
# Orchestrator for reusable workflows
# ==========================================

name: CI/CD Pipeline

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # ==========================================
  # Stage 0: Debug Environment
  # ==========================================
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Debug Environment Variables
        run: |
          echo "=== DEBUG: Environment Variables ==="
          echo "GitHub Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "INFRASTRUCTURE_IP_LIST exists: ${{ secrets.INFRASTRUCTURE_IP_LIST != '' }}"
          echo "SERVER_IP exists: ${{ secrets.SERVER_IP != '' }}"
          echo "======================================"

  # ==========================================
  # Stage 1: Build Docker Image
  # ==========================================
  build:
    needs: debug
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  # ==========================================
  # Stage 2: Application Deploy
  # ==========================================
  deploy:
    needs: [debug, build]
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ needs.build.outputs.image_tag }}
      image_name: ${{ needs.build.outputs.image_name }}
    secrets: inherit

  # ==========================================
  # Stage 3: Infrastructure Setup (after app is ready)
  # ==========================================
  infrastructure:
    needs: [debug, build, deploy]
    uses: ./.github/workflows/infrastructure.yml
    secrets: inherit

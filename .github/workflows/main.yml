# ==========================================
# CloudNode CI/CD Orchestrator
# ==========================================
# This workflow orchestrates the deployment pipeline by calling
# reusable workflows for each stage:
#   1. Build - Docker image creation and push to GHCR
#   2. Infrastructure - Ansible node configuration
#   3. Deploy - Application deployment to master node
#
# Each stage is defined in separate files:
#   - _build.yml
#   - _infrastructure.yml
#   - _deploy.yml
# ==========================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Stage 1: Build Docker Image
  build:
    name: Build
    uses: ./.github/workflows/_build.yml
    with:
      registry: ghcr.io
    permissions:
      contents: read
      packages: write

  # Stage 2: Configure Infrastructure Nodes
  infrastructure:
    name: Infrastructure
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_infrastructure.yml
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      REALITY_PRIVATE_KEY: ${{ secrets.REALITY_PRIVATE_KEY }}
      REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
      REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}

  # Stage 3: Deploy Application
  deploy:
    name: Deploy
    needs: [build, infrastructure]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    uses: ./.github/workflows/_deploy.yml
    with:
      image_tag: ${{ github.sha }}
      registry: ghcr.io
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SERVER_IP: ${{ secrets.SERVER_IP }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      REDIS_HOST: ${{ secrets.REDIS_HOST }}
      REDIS_PORT: ${{ secrets.REDIS_PORT }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
      VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
      VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
      INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
      DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
      REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
      REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
      MARZBAN_INBOUND_TAG: ${{ secrets.MARZBAN_INBOUND_TAG }}

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Stage 1: Build & Push Docker Image
  # ==========================================
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.normalize.outputs.image_name_lower }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: normalize
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "Normalized image: ${IMAGE_NAME_LOWER}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.normalize.outputs.image_name_lower }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "=== Built Image ==="
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "==================="

  # ==========================================
  # Stage 2: Verify Secrets
  # ==========================================
  verify-secrets:
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      INFRA_JSON: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
    steps:
      - name: Check required secrets
        run: |
          echo "=== Verifying Secrets ==="
          errors=0

          # Validate SERVER_IP JSON format
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "SERVER_IP is not set"
            errors=$((errors + 1))
          else
            SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address // empty')
            if [ -n "$SERVER_ADDRESS" ]; then
              echo "SERVER_IP is set (address: $SERVER_ADDRESS)"
            else
              echo "SERVER_IP has invalid format. Expected: {\"address\": \"1.2.3.4\", \"password\": \"...\"}"
              errors=$((errors + 1))
            fi
          fi

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY is not set"
            errors=$((errors + 1))
          else
            echo "SSH_PRIVATE_KEY is set"
          fi

          if [ -z "${{ secrets.DOMAIN_NAME }}" ]; then
            echo "DOMAIN_NAME is not set"
            errors=$((errors + 1))
          else
            echo "DOMAIN_NAME is set"
          fi

          # INFRASTRUCTURE_IP_LIST: если задан — строго валидный непустой JSON-массив с address
          if [ -n "${INFRA_JSON:-}" ] && [ "$INFRA_JSON" != "null" ]; then
            if N=$(python3 -c "import json,os; d=json.loads((os.environ.get('INFRA_JSON') or '').strip()); assert isinstance(d,list) and len(d)>0; assert all(isinstance(x,dict) and x.get('address') for x in d); print(len(d))"); then
              echo "INFRASTRUCTURE_IP_LIST OK ($N nodes)"
            else
              echo "INFRASTRUCTURE_IP_LIST is invalid. Expected non-empty [{\"address\": \"…\", \"password\": \"…\"}, …]"
              errors=$((errors + 1))
            fi
          else
            echo "INFRASTRUCTURE_IP_LIST is not set (optional)"
          fi

          echo "========================"

          if [ $errors -gt 0 ]; then
            echo "$errors secret(s) missing or invalid. Check GitHub Settings > Secrets."
            exit 1
          fi

          echo "All required secrets verified"
          echo ""
          echo "Note: DB_PASSWORD, VPN_ADMIN_PASSWORD and other vars will be validated by Ansible during deploy"

  # ==========================================
  # Stage 2b: Ansible syntax (без доступа к серверам)
  # ==========================================
  ansible-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ansible
        run: pip install "ansible-core>=2.14,<3"
      - name: Syntax check playbooks
        run: |
          set -euo pipefail
          INV=ansible/ci_inventory.ini
          ansible-playbook --syntax-check -i "$INV" ansible/bootstrap-phase.yml
          ansible-playbook --syntax-check -i "$INV" ansible/deploy-phase.yml
          ansible-playbook --syntax-check -i "$INV" ansible/deploy-master.yml
          ansible-playbook --syntax-check -i "$INV" ansible/deploy-node.yml

  # ==========================================
  # Stage 3: Deploy Application
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push, verify-secrets, ansible-validate]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install dependencies
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y jq sshpass

      - name: Check if server needs bootstrap
        id: check_bootstrap
        run: |
          echo "=== Checking Server Bootstrap Status ==="

          SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address')

          # Test SSH key access first
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@$SERVER_ADDRESS "echo 'SSH key access works'" 2>/dev/null; then
            echo "Server already bootstrapped - SSH key access works"
            echo "needs_bootstrap=false" >> $GITHUB_OUTPUT
          else
            echo "Server needs bootstrap - SSH key access failed"
            echo "needs_bootstrap=true" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap server if needed
        if: steps.check_bootstrap.outputs.needs_bootstrap == 'true'
        run: |
          echo "=== Bootstrapping Server ==="

          # Parse server credentials
          SERVER_IP_JSON='${{ secrets.SERVER_IP }}'
          SERVER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address')
          SERVER_PASSWORD=$(echo "$SERVER_IP_JSON" | jq -r '.password')

          echo "Bootstrapping server: $SERVER_ADDRESS"

          # Generate bootstrap inventory with password auth
          cat > inventory_bootstrap.ini << EOF
          [master]
          $SERVER_ADDRESS ansible_user=root ansible_ssh_pass='$SERVER_PASSWORD' ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          EOF

          # Run bootstrap playbook
          ansible-playbook -i inventory_bootstrap.ini ansible/bootstrap-phase.yml \
            -e "ssh_public_key='${{ secrets.SSH_PUBLIC_KEY }}'" \
            -v

          # Clean up bootstrap inventory
          rm -f inventory_bootstrap.ini

          echo "=== Bootstrap completed ==="

      - name: Write Ansible deploy vars
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
          REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
          MARZBAN_INBOUND_TAG: ${{ vars.MARZBAN_INBOUND_TAG || 'VLESS TCP REALITY' }}
          VPN_PANEL_URL: ${{ secrets.VPN_PANEL_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/write-deploy-vars.sh

      - name: Deploy to server
        run: |
          set -euo pipefail
          echo "=== Starting Deploy ==="

          SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address')

          cat > inventory.ini << EOF
          [master]
          $SERVER_ADDRESS

          [master:vars]
          ansible_user=root
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF

          echo "=== Generated inventory.ini (SSH key auth) ==="
          cat inventory.ini

          ansible-playbook -i inventory.ini ansible/deploy-phase.yml \
            -e "@deploy_vars.yml" \
            -v

  # ==========================================
  # Stage 4: Setup Infrastructure (Nodes)
  # ==========================================
  infrastructure:
    runs-on: ubuntu-latest
    needs: [deploy, build-and-push]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install dependencies
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y sshpass jq

      - name: Parse master server address for nodes
        run: |
          # Parse master server IP from JSON
          SERVER_IP_JSON='${{ secrets.SERVER_IP }}'
          MASTER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address // empty')
          echo "MASTER_ADDRESS=$MASTER_ADDRESS" >> $GITHUB_ENV
          echo "Master server address: $MASTER_ADDRESS"

      # inventory только [nodes]: play «master» в deploy-phase.yml будет с 0 хостов (пропуск) — так и задумано.
      - name: Bootstrap nodes if needed
        run: |
          set -euo pipefail
          echo "=== Checking and Bootstrapping Nodes ==="
          NODES_JSON='${{ secrets.INFRASTRUCTURE_IP_LIST }}'
          if [ -z "$NODES_JSON" ] || [ "$NODES_JSON" = "null" ] || [ "$NODES_JSON" = "[]" ]; then
            echo "No infrastructure nodes in secrets, skipping node bootstrap"
            exit 0
          fi
          while IFS= read -r node; do
            [ -z "$node" ] && continue
            node_address=$(echo "$node" | jq -r '.address // empty')
            node_password=$(echo "$node" | jq -r '.password // empty')
            [ -z "$node_address" ] && continue
            if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa root@$node_address "echo ok" 2>/dev/null; then
              echo "Node $node_address already bootstrapped"
              continue
            fi
            if [ -z "$node_password" ] || [ "$node_password" = "null" ]; then
              echo "ERROR: Node $node_address has no password for initial bootstrap"
              exit 1
            fi
            echo "Bootstrapping $node_address with password auth"
            printf "[nodes]\n%s ansible_user=root ansible_ssh_pass='%s' ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'\n[nodes:vars]\nansible_python_interpreter=/usr/bin/python3\n" "$node_address" "$node_password" > bootstrap_node.ini
            ansible-playbook -i bootstrap_node.ini ansible/bootstrap-phase.yml -e "ssh_public_key='${{ secrets.SSH_PUBLIC_KEY }}'" -v
            rm -f bootstrap_node.ini
          done < <(echo "$NODES_JSON" | jq -c '.[]')

      - name: Generate inventory for nodes
        run: |
          set -euo pipefail
          NODES_JSON='${{ secrets.INFRASTRUCTURE_IP_LIST }}'

          echo "[nodes]" > inventory_nodes.ini

          if [ -n "$NODES_JSON" ] && [ "$NODES_JSON" != "null" ] && [ "$NODES_JSON" != "[]" ]; then
            while IFS= read -r node; do
              [ -z "$node" ] && continue
              node_address=$(echo "$node" | jq -r '.address // empty')
              if [ -n "$node_address" ]; then
                echo "$node_address ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_nodes.ini
                echo "Added node: $node_address"
              fi
            done < <(echo "$NODES_JSON" | jq -c '.[]')
          fi

          echo "[nodes:vars]" >> inventory_nodes.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory_nodes.ini

          echo "=== Generated inventory_nodes.ini ==="
          cat inventory_nodes.ini

      - name: Write Ansible deploy vars
        env:
          IMAGE_NAME: ${{ needs.build-and-push.outputs.image_name }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VPN_ADMIN_USERNAME: ${{ secrets.VPN_ADMIN_USERNAME }}
          VPN_ADMIN_PASSWORD: ${{ secrets.VPN_ADMIN_PASSWORD }}
          INFRASTRUCTURE_IP_LIST: ${{ secrets.INFRASTRUCTURE_IP_LIST }}
          REALITY_PUBLIC_KEY: ${{ secrets.REALITY_PUBLIC_KEY }}
          REALITY_SHORT_ID: ${{ secrets.REALITY_SHORT_ID }}
          MARZBAN_INBOUND_TAG: ${{ vars.MARZBAN_INBOUND_TAG || 'VLESS TCP REALITY' }}
          VPN_PANEL_URL: ${{ secrets.VPN_PANEL_URL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash scripts/ci/write-deploy-vars.sh

      - name: Setup infrastructure
        run: |
          set -euo pipefail
          echo "=== Deploying Infrastructure ==="

          # Только группа nodes: play master в deploy-phase.yml пропускается (0 хостов).
          ansible-playbook -i inventory_nodes.ini ansible/deploy-phase.yml \
            -e "@deploy_vars.yml" \
            -e "master_server_address=$MASTER_ADDRESS" \
            -e "domain_name_extra=${{ secrets.DOMAIN_NAME }}" \
            -e "vpn_admin_username=${{ secrets.VPN_ADMIN_USERNAME }}" \
            -e "vpn_admin_password=${{ secrets.VPN_ADMIN_PASSWORD }}" \
            -e "service_port=62050" \
            -e "xray_api_port=62051" \
            -e "github_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "github_actor=${{ github.actor }}" \
            -v

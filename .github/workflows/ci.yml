name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Stage 1: Test & Build
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint || echo "No lint script"

      - name: Test
        run: npm test || echo "No tests yet"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "=== Built Image ==="
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "==================="

  # ==========================================
  # Stage 2: Verify Secrets
  # ==========================================
  verify-secrets:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Check required secrets
        run: |
          echo "=== Verifying Secrets ==="
          errors=0
          
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "❌ SERVER_IP is not set"
            errors=$((errors + 1))
          else
            echo "✅ SERVER_IP is set"
          fi
          
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "❌ SSH_PRIVATE_KEY is not set"
            errors=$((errors + 1))
          else
            echo "✅ SSH_PRIVATE_KEY is set"
          fi
          
          if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
            echo "❌ DB_PASSWORD is not set"
            errors=$((errors + 1))
          else
            echo "✅ DB_PASSWORD is set"
          fi
          
          if [ -z "${{ secrets.DOMAIN_NAME }}" ]; then
            echo "❌ DOMAIN_NAME is not set"
            errors=$((errors + 1))
          else
            echo "✅ DOMAIN_NAME is set"
          fi
          
          echo "========================"
          
          if [ $errors -gt 0 ]; then
            echo "❌ $errors secret(s) missing. Check GitHub Settings > Secrets."
            exit 1
          fi
          
          echo "✅ All required secrets verified"

  # ==========================================
  # Stage 3: Deploy Application
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [test-and-build, verify-secrets]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install Ansible
        run: pip install ansible

      - name: Generate inventory
        run: |
          cat > inventory.ini <<EOF
          [master]
          ${{ secrets.SERVER_IP }}
          
          [master:vars]
          ansible_user=root
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          EOF
          cat inventory.ini

      - name: Deploy to server
        env:
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ needs.test-and-build.outputs.image_tag }}
        run: |
          echo "=== Starting Deploy ==="
          ansible-playbook -i inventory.ini ansible/deploy_app.yml \
            -e "image_name=${IMAGE_NAME}" \
            -e "image_tag=${IMAGE_TAG}" \
            -e "domain_name=${{ secrets.DOMAIN_NAME }}" \
            -e "db_password=${{ secrets.DB_PASSWORD }}" \
            -e "redis_password=${{ secrets.REDIS_PASSWORD }}" \
            -e "telegram_bot_token=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            -e "encryption_key=${{ secrets.ENCRYPTION_KEY }}" \
            -e "vpn_admin_username=${{ secrets.VPN_ADMIN_USERNAME }}" \
            -e "vpn_admin_password=${{ secrets.VPN_ADMIN_PASSWORD }}" \
            -e "infrastructure_ip_list=${{ secrets.INFRASTRUCTURE_IP_LIST }}" \
            -e "reality_public_key=${{ secrets.REALITY_PUBLIC_KEY }}" \
            -e "reality_short_id=${{ secrets.REALITY_SHORT_ID }}" \
            -e "marzban_inbound_tag=${{ vars.MARZBAN_INBOUND_TAG || 'VLESS_REALITY' }}" \
            -v

  # ==========================================
  # Stage 4: Setup Infrastructure (Nodes)
  # ==========================================
  infrastructure:
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ vars.INFRASTRUCTURE_IP_LIST != '' || github.event.inputs.infrastructure_ips_json != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install Ansible
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y sshpass

      - name: Generate node inventory
        run: |
          # Parse infrastructure IPs and create inventory
          echo "[nodes]" > inventory_nodes.ini
          
          # Convert space-separated IPs to inventory format
          for ip in ${{ secrets.INFRASTRUCTURE_IP_LIST }}; do
            echo "$ip ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_nodes.ini
          done
          
          echo "[nodes:vars]" >> inventory_nodes.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory_nodes.ini
          
          cat inventory_nodes.ini

      - name: Setup infrastructure
        run: |
          echo "=== Deploying Infrastructure ==="
          ansible-playbook -i inventory_nodes.ini ansible/deploy_node.yml \
            -e "master_server_address=${{ secrets.SERVER_IP }}" \
            -e "domain_name=${{ secrets.DOMAIN_NAME }}" \
            -e "service_port=62050" \
            -e "xray_api_port=62051" \
            -v

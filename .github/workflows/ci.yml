name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # Stage 1: Build & Push Docker Image
  # ==========================================
  test-and-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
      image_name: ${{ steps.normalize.outputs.image_name_lower }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name to lowercase
        id: normalize
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name_lower=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT
          echo "Normalized image: ${IMAGE_NAME_LOWER}"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.normalize.outputs.image_name_lower }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image info
        run: |
          echo "=== Built Image ==="
          echo "Image: ${{ steps.meta.outputs.tags }}"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "==================="

  # ==========================================
  # Stage 2: Verify Secrets
  # ==========================================
  verify-secrets:
    runs-on: ubuntu-latest
    needs: test-and-build
    steps:
      - name: Check required secrets
        run: |
          echo "=== Verifying Secrets ==="
          errors=0

          # Validate SERVER_IP JSON format
          if [ -z "${{ secrets.SERVER_IP }}" ]; then
            echo "SERVER_IP is not set"
            errors=$((errors + 1))
          else
            SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address // empty')
            if [ -n "$SERVER_ADDRESS" ]; then
              echo "SERVER_IP is set (address: $SERVER_ADDRESS)"
            else
              echo "SERVER_IP has invalid format. Expected: {\"address\": \"1.2.3.4\", \"password\": \"...\"}"
              errors=$((errors + 1))
            fi
          fi

          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY is not set"
            errors=$((errors + 1))
          else
            echo "SSH_PRIVATE_KEY is set"
          fi

          if [ -z "${{ secrets.DOMAIN_NAME }}" ]; then
            echo "DOMAIN_NAME is not set"
            errors=$((errors + 1))
          else
            echo "DOMAIN_NAME is set"
          fi

          # Validate INFRASTRUCTURE_IP_LIST JSON format if set
          INFRA_JSON='${{ secrets.INFRASTRUCTURE_IP_LIST }}'
          if [ -n "$INFRA_JSON" ] && [ "$INFRA_JSON" != "null" ]; then
            NODE_COUNT=$(echo "$INFRA_JSON" | jq -r '. | length')
            if [ "$NODE_COUNT" -gt 0 ] 2>/dev/null; then
              echo "INFRASTRUCTURE_IP_LIST is set ($NODE_COUNT nodes)"
            else
              echo "INFRASTRUCTURE_IP_LIST has invalid format or empty. Expected: [{\"address\": \"1.2.3.5\", \"password\": \"...\"}]"
            fi
          else
            echo "INFRASTRUCTURE_IP_LIST is not set (optional)"
          fi

          echo "========================"

          if [ $errors -gt 0 ]; then
            echo "$errors secret(s) missing or invalid. Check GitHub Settings > Secrets."
            exit 1
          fi

          echo "All required secrets verified"
          echo ""
          echo "Note: DB_PASSWORD, VPN_ADMIN_PASSWORD and other vars will be validated by Ansible during deploy"

  # ==========================================
  # Stage 3: Deploy Application
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: [test-and-build, verify-secrets]
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install dependencies
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y jq sshpass

      
      - name: Check if server needs bootstrap
        id: check_bootstrap
        run: |
          echo "=== Checking Server Bootstrap Status ==="
          
          SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address')
          
          # Test SSH key access first
          if ssh -o BatchMode=yes -o ConnectTimeout=10 -o StrictHostKeyChecking=no root@$SERVER_ADDRESS "echo 'SSH key access works'" 2>/dev/null; then
            echo "Server already bootstrapped - SSH key access works"
            echo "needs_bootstrap=false" >> $GITHUB_OUTPUT
          else
            echo "Server needs bootstrap - SSH key access failed"
            echo "needs_bootstrap=true" >> $GITHUB_OUTPUT
          fi

      - name: Bootstrap server if needed
        if: steps.check_bootstrap.outputs.needs_bootstrap == 'true'
        run: |
          echo "=== Bootstrapping Server ==="
          
          # Parse server credentials
          SERVER_IP_JSON='${{ secrets.SERVER_IP }}'
          SERVER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address')
          SERVER_PASSWORD=$(echo "$SERVER_IP_JSON" | jq -r '.password')
          
          echo "Bootstrapping server: $SERVER_ADDRESS"
          
          # Generate bootstrap inventory with password auth
          cat > inventory_bootstrap.ini << EOF
          [master]
          $SERVER_ADDRESS ansible_user=root ansible_ssh_pass='$SERVER_PASSWORD' ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          
          [all:vars]
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          EOF
          
          # Run bootstrap playbook
          ansible-playbook -i inventory_bootstrap.ini ansible/bootstrap-phase.yml \
            -e "ssh_public_key='${{ secrets.SSH_PUBLIC_KEY }}'" \
            -v
          
          # Clean up bootstrap inventory
          rm -f inventory_bootstrap.ini
          
          echo "=== Bootstrap completed ==="

      - name: Deploy to server
        env:
          IMAGE_NAME: ${{ needs.test-and-build.outputs.image_name }}
          IMAGE_TAG: ${{ needs.test-and-build.outputs.image_tag }}
        run: |
          echo "=== Starting Deploy ==="
          echo "Image: ${IMAGE_NAME}"
          
          # Regenerate inventory with SSH key authentication (bootstrap complete)
          SERVER_ADDRESS=$(echo '${{ secrets.SERVER_IP }}' | jq -r '.address')
          
          cat > inventory.ini << EOF
          [master]
          $SERVER_ADDRESS
          
          [master:vars]
          ansible_user=root
          ansible_ssh_private_key_file=~/.ssh/id_rsa
          ansible_python_interpreter=/usr/bin/python3
          ansible_ssh_common_args='-o StrictHostKeyChecking=no'
          EOF
          
          echo "=== Generated inventory.ini (SSH key auth) ==="
          cat inventory.ini
          
          # Write vars to file to avoid shell escaping issues with JSON
          cat > deploy_vars.yml << VARS_EOF
          ---
          image_name: "${IMAGE_NAME}"
          image_tag: "${IMAGE_TAG}"
          domain_name: "${{ secrets.DOMAIN_NAME }}"
          db_password: "${{ secrets.VPN_ADMIN_PASSWORD }}"
          redis_password: "${{ secrets.VPN_ADMIN_PASSWORD }}"
          telegram_bot_token: "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          encryption_key: "${{ secrets.ENCRYPTION_KEY }}"
          vpn_admin_username: "${{ secrets.VPN_ADMIN_USERNAME }}"
          vpn_admin_password: "${{ secrets.VPN_ADMIN_PASSWORD }}"
          infrastructure_ip_list: '${{ secrets.INFRASTRUCTURE_IP_LIST }}'
          reality_public_key: "${{ secrets.REALITY_PUBLIC_KEY }}"
          reality_short_id: "${{ secrets.REALITY_SHORT_ID }}"
          marzban_inbound_tag: "${{ vars.MARZBAN_INBOUND_TAG || 'VLESS_REALITY' }}"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          github_actor: "${{ github.actor }}"
          VARS_EOF
          
          ansible-playbook -i inventory.ini ansible/deploy-phase.yml \
            -e "@deploy_vars.yml" \
            -v

  # ==========================================
  # Stage 4: Setup Infrastructure (Nodes)
  # ==========================================
  infrastructure:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      - name: Install dependencies
        run: |
          pip install ansible
          sudo apt-get update && sudo apt-get install -y sshpass jq

      - name: Parse INFRASTRUCTURE_IP_LIST and generate inventory
        run: |
          # Parse JSON array format: [{"address": "1.2.3.5", "password": "..."}]
          NODES_JSON='${{ secrets.INFRASTRUCTURE_IP_LIST }}'

          echo "[nodes]" > inventory_nodes.ini

          # Extract nodes with passwords from JSON array
          echo "$NODES_JSON" | jq -c '.[]' | while read node; do
            node_address=$(echo "$node" | jq -r '.address // empty')
            node_password=$(echo "$node" | jq -r '.password // empty')

            if [ -n "$node_address" ]; then
              if [ -n "$node_password" ] && [ "$node_password" != "null" ]; then
                # Password authentication (fresh server)
                echo "$node_address ansible_user=root ansible_ssh_pass=$node_password ansible_ssh_extra_args='-o PubkeyAuthentication=no -o PasswordAuthentication=yes -o StrictHostKeyChecking=no'" >> inventory_nodes.ini
                echo "Added node (password auth): $node_address"
              else
                # Key authentication (already bootstrapped)
                echo "$node_address ansible_user=root ansible_ssh_private_key_file=~/.ssh/id_rsa" >> inventory_nodes.ini
                echo "Added node (key auth): $node_address"
              fi
            fi
          done

          echo "[nodes:vars]" >> inventory_nodes.ini
          echo "ansible_python_interpreter=/usr/bin/python3" >> inventory_nodes.ini

          echo "=== Generated inventory_nodes.ini ==="
          cat inventory_nodes.ini

      - name: Parse master server address for nodes
        run: |
          # Parse master server IP from JSON
          SERVER_IP_JSON='${{ secrets.SERVER_IP }}'
          MASTER_ADDRESS=$(echo "$SERVER_IP_JSON" | jq -r '.address // empty')
          echo "MASTER_ADDRESS=$MASTER_ADDRESS" >> $GITHUB_ENV
          echo "Master server address: $MASTER_ADDRESS"

      - name: Setup infrastructure
        run: |
          echo "=== Deploying Infrastructure ==="
          # Deploy phase includes both master and nodes in unified playbook
          ansible-playbook -i inventory_nodes.ini ansible/deploy-phase.yml \
            -e "@deploy_vars.yml" \
            -e "master_server_address=$MASTER_ADDRESS" \
            -e "domain_name_extra=${{ secrets.DOMAIN_NAME }}" \
            -e "vpn_admin_username=${{ secrets.VPN_ADMIN_USERNAME }}" \
            -e "vpn_admin_password=${{ secrets.VPN_ADMIN_PASSWORD }}" \
            -e "service_port=62050" \
            -e "xray_api_port=62051" \
            -e "github_token=${{ secrets.GITHUB_TOKEN }}" \
            -e "github_actor=${{ github.actor }}" \
            -v
